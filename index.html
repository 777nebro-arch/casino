<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Танчики 1990</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        html, body { height: 100vh; width: 100vw; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; }
        .game-wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; background: #000; touch-action: none; position: relative; }
        .game-container { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        canvas { 
            display: block; width: 100%; height: 100%; object-fit: contain; 
            background: #000; 
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
            touch-action: none; 
        }

        /* HUD */
        .info {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 12px; color: #fff; font-size: 14px; font-weight: bold;
            background: #151515; border-bottom: 2px solid #222;
            flex-shrink: 0; font-family: 'Courier New', monospace;
        }
        .info-item { display: flex; align-items: center; gap: 6px; color: #aaa; }
        .info-item span { color: #ffd700; font-size: 16px; }
        .progress-wrap { flex: 1; display: flex; align-items: center; margin-left: 10px; gap: 6px; }
        .progress-bar { flex: 1; height: 4px; background: #222; border-radius: 2px; overflow: hidden; border: 1px solid #333;}
        .progress-fill { height: 100%; width: 0%; background: #ffcc00; transition: width 0.2s; }

        /* Управление */
        .controls { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 12px 10px; gap: 8px; background: #111; border-top: 2px solid #222; flex-shrink: 0; }
        .joystick-area { flex: 1; display: flex; justify-content: center; }
        .joystick { width: 120px; height: 120px; background: #1a1a1a; border-radius: 50%; position: relative; border: 3px solid #333; box-shadow: inset 0 0 15px #000; }
        .joystick-knob { width: 44px; height: 44px; background: #333; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid #555; pointer-events: none; }
        .fire-area { flex: 1; display: flex; justify-content: center; align-items: center; }
        .fire-btn { width: 100px; height: 100px; border-radius: 50%; background: #c0392b; border: 4px solid #e74c3c; color: #fff; font-size: 26px; font-weight: bold; text-shadow: 0 2px 0 #500; box-shadow: inset 0 -4px 0 #600; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; transition: transform 0.05s; }
        .fire-btn:active { transform: scale(0.90); }

        .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: #1a1a1a; border: 2px solid #444; color: #fff; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 10px #000; }
        .icon-btn:active { background: #333; }

        /* Меню выбора сложности */
        .menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; padding: 20px; gap: 20px;
        }
        .menu-screen h1 { color: #f1c40f; font-size: 28px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(241,196,15,0.3); font-family: 'Courier New', monospace; margin-bottom: 5px;}
        .menu-screen p { color: #bbb; font-size: 14px; margin-bottom: 15px; }
        
        .toggle-switch {
            display: flex; background: #1a1a1a; border: 2px solid #333;
            border-radius: 6px; overflow: hidden; width: 100%; max-width: 300px;
        }
        .toggle-option {
            flex: 1; text-align: center; padding: 8px 0; font-size: 14px;
            color: #777; background: transparent; cursor: pointer;
            font-family: 'Courier New', monospace; font-weight: bold;
            transition: all 0.1s ease; border-right: 1px solid #222;
        }
        .toggle-option:last-child { border-right: none; }
        .toggle-option.active {
            background: #f1c40f; color: #000; box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        .toggle-option:active { transform: scale(0.95); }

        .btn-start {
            margin-top: 20px; padding: 12px 36px; background: #f1c40f; border: none; border-radius: 4px;
            color: #000; font-size: 18px; font-weight: bold; cursor: pointer;
            font-family: 'Courier New', monospace;
            box-shadow: 0 4px 0 #d4ac0d; transition: all 0.1s;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: none; }
        .btn-start:hover { background: #f39c12; }

        /* Оверлей загрузки сохранения */
        .load-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center;
            z-index: 55; padding: 20px;
        }
        .load-dialog {
            background: #151515; border: 2px solid #555; border-radius: 8px; padding: 30px;
            text-align: center; max-width: 320px; width: 100%; box-shadow: 0 20px 40px #000;
        }
        .load-dialog h2 { color: #f1c40f; font-size: 20px; margin-bottom: 10px; font-family: 'Courier New', monospace; }
        .load-dialog p { color: #bbb; font-size: 14px; margin-bottom: 20px; }
        .load-dialog .btn-group { display: flex; gap: 12px; justify-content: center; }
        .load-dialog .btn { padding: 8px 20px; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: 'Courier New', monospace; }
        .load-dialog .btn-yes { background: #f1c40f; color: #000; }
        .load-dialog .btn-yes:hover { background: #f39c12; }
        .load-dialog .btn-no { background: #444; color: #fff; }
        .load-dialog .btn-no:hover { background: #555; }

        @media (max-width: 500px) {
            .joystick { width: 90px; height: 90px; }
            .joystick-knob { width: 34px; height: 34px; }
            .fire-btn { width: 80px; height: 80px; font-size: 22px; }
            .info { font-size: 12px; padding: 3px 8px; }
            .icon-btn { width: 32px; height: 32px; font-size: 14px; }
            .menu-screen h1 { font-size: 24px; }
            .btn-start { padding: 10px 24px; font-size: 16px; }
            .toggle-option { font-size: 12px; padding: 6px 0; }
        }
        @media (max-width: 380px) {
            .joystick { width: 70px; height: 70px; }
            .joystick-knob { width: 28px; height: 28px; }
            .fire-btn { width: 65px; height: 65px; font-size: 18px; }
            .info { font-size: 10px; padding: 2px 6px; }
            .icon-btn { width: 28px; height: 28px; font-size: 12px; }
            .toggle-option { font-size: 10px; padding: 4px 0; }
        }
    </style>
</head>
<body>
<div class="game-wrapper" id="gameWrapper">
    <!-- HUD -->
    <div class="info">
        <div class="info-item">РАУНД <span id="roundDisplay">1</span></div>
        <div class="info-item">ЖИЗНИ <span id="livesDisplay">3</span></div>
        <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
    </div>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="780" height="780"></canvas>
        
        <!-- Меню выбора сложности с маленьким переключателем -->
        <div class="menu-screen" id="menuScreen">
            <h1>ТАНЧИКИ 1990</h1>
            <p>ВЫБЕРИТЕ СЛОЖНОСТЬ</p>
            
            <div class="toggle-switch" id="difficultyToggle">
                <div class="toggle-option" data-value="easy">ЛЁГКИЙ</div>
                <div class="toggle-option active" data-value="normal">СРЕДНИЙ</div>
                <div class="toggle-option" data-value="hard">СЛОЖНЫЙ</div>
            </div>

            <button class="btn-start" id="btnStart">НАЧАТЬ ИГРУ</button>
        </div>

        <!-- Оверлей загрузки сохранения -->
        <div class="load-overlay" id="loadOverlay">
            <div class="load-dialog">
                <h2>ЗАГРУЗИТЬ СОХРАНЕНИЕ?</h2>
                <p>Обнаружен прогресс для этого уровня. Продолжить?</p>
                <div class="btn-group">
                    <button class="btn btn-yes" id="loadYes">ДА</button>
                    <button class="btn btn-no" id="loadNo">НЕТ</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Управление -->
    <div class="controls">
        <button class="icon-btn" id="fullscreenBtn">[ ]</button>
        <div class="joystick-area">
            <div class="joystick" id="joystick">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>
        </div>
        <div class="fire-area">
            <div class="fire-btn" id="fireBtn">🔥</div>
        </div>
        <button class="icon-btn" id="closeBtn">✕</button>
    </div>
</div>

<script>
    (function() {
        // ---------- Telegram Web App ----------
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                tg.requestOrientation('portrait');
            }
        } catch(e) { console.log("Not in Telegram"); }

        // ---------- Константы ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const livesSpan = document.getElementById('livesDisplay');
        const roundSpan = document.getElementById('roundDisplay');
        const progressFill = document.getElementById('progressFill');
        const menuScreen = document.getElementById('menuScreen');
        const btnStart = document.getElementById('btnStart');
        const loadOverlay = document.getElementById('loadOverlay');
        const loadYes = document.getElementById('loadYes');
        const loadNo = document.getElementById('loadNo');
        
        const toggleOptions = document.querySelectorAll('.toggle-option');

        const TILE = 60; const COLS = 13; const ROWS = 13;
        const PLAYER_SPEED = 3.0;
        const ENEMY_BASE_SPEED = 1.2;
        const BULLET_SPEED = 5.0;

        // ---------- Углублённые настройки сложности ----------
        const DIFFICULTY_SETTINGS = {
            easy: { 
                enemySpeedMult: 0.7, enemyFireRateMult: 0.5, 
                enemiesPerRoundBase: 5, maxEnemies: 3, lives: 5, 
                fastChance: 0.05, armoredChance: 0.0, shooterChance: 0.0, 
                aiChaseChance: 0.2, scoreMult: 1, spawnDelay: 90,
                wallDensity: 0.25, steelChance: 0.1 
            },
            normal: { 
                enemySpeedMult: 1.0, enemyFireRateMult: 0.9, 
                enemiesPerRoundBase: 8, maxEnemies: 4, lives: 3, 
                fastChance: 0.15, armoredChance: 0.1, shooterChance: 0.05, 
                aiChaseChance: 0.4, scoreMult: 1.5, spawnDelay: 70,
                wallDensity: 0.35, steelChance: 0.15
            },
            hard: { 
                enemySpeedMult: 1.4, enemyFireRateMult: 1.3, 
                enemiesPerRoundBase: 10, maxEnemies: 5, lives: 2, 
                fastChance: 0.25, armoredChance: 0.2, shooterChance: 0.15, 
                aiChaseChance: 0.7, scoreMult: 2.0, spawnDelay: 50,
                wallDensity: 0.45, steelChance: 0.25
            }
        };

        let difficulty = 'normal';
        let settings = DIFFICULTY_SETTINGS[difficulty];
        let gameOver = false, win = false, score = 0, lives = 3, frame = 0;
        let enemiesAlive = 0, currentRound = 1, enemiesPerRound = 8;
        let enemiesSpawnedInRound = 0, enemiesKilledInRound = 0, roundComplete = false;
        let playerBonuses = { speed: 0, shield: 0, power: 0 };
        let MAX_ENEMIES_ON_SCREEN = 4;
        let currentSpawnDelay = 70;
        const player = { x: 1*TILE, y: 12*TILE, w: TILE-2, h: TILE-2, dir:0, speed:PLAYER_SPEED, cooldown:0, alive:true, respawnTimer:0 };
        let bullets = [], enemies = [], walls = [], base = null, spawnTimer = 0;
        let particles = [], bonuses = [];
        let nets = [];
        
        let audioCtx = null;

        // ---------- Звук ----------
        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
        }
        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                const s = {
                    fire: {type:'square', freq:[800,200], dur:0.1, vol:0.3},
                    explode: {type:'sawtooth', freq:[150,50], dur:0.3, vol:0.4},
                    damage: {type:'sine', freq:[300,100], dur:0.2, vol:0.5},
                    win: {type:'square', freq:[523,659,784], dur:0.5, vol:0.3},
                    gameover: {type:'sawtooth', freq:[200,80], dur:0.8, vol:0.4},
                    bonus: {type:'sine', freq:[880,660], dur:0.2, vol:0.2}
                }[type];
                if (!s) return;
                osc.type = s.type;
                osc.frequency.setValueAtTime(s.freq[0], now);
                if (s.freq.length > 1) osc.frequency.exponentialRampToValueAtTime(s.freq[1], now + s.dur);
                gain.gain.setValueAtTime(s.vol, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + s.dur);
                osc.start(now); osc.stop(now + s.dur);
            } catch(e) {}
        }
        function vibrate(d) {
            try { if (navigator.vibrate) navigator.vibrate(d); } catch(e) {}
        }

        // ---------- Частицы ----------
        function spawnExplosion(x,y,count,color) {
            for (let i=0; i<count; i++) {
                const angle = Math.random()*2*Math.PI;
                const speed = 1 + Math.random()*4;
                const colors = color ? [color] : ['#ff6600','#ffaa00','#ff4400','#ffcc44','#ff0000'];
                particles.push({
                    x: x+(Math.random()-0.5)*10,
                    y: y+(Math.random()-0.5)*10,
                    vx: Math.cos(angle)*speed,
                    vy: Math.sin(angle)*speed,
                    life: 0.8+Math.random()*0.6,
                    decay: 0.008+Math.random()*0.015,
                    size: 2+Math.random()*4,
                    color: colors[Math.floor(Math.random()*colors.length)]
                });
            }
        }
        function updateParticles() {
            for (let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vx*=0.98; p.vy*=0.98; p.life-=p.decay; p.size*=0.99;
                if (p.life<=0 || p.size<0.5) particles.splice(i,1);
            }
        }
        function drawParticles() {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
            }
            ctx.restore(); ctx.globalAlpha = 1;
        }

        // ---------- Бонусы ----------
        const BONUS_TYPES = ['speed','shield','power','life'];
        function dropBonus(x,y) {
            if (Math.random()>0.25) return;
            const type = BONUS_TYPES[Math.floor(Math.random()*BONUS_TYPES.length)];
            bonuses.push({ x,y,type,w:20,h:20,vy:-1,alive:true,bob:0 });
            playSound('bonus');
        }
        function updateBonuses() {
            for (let i=bonuses.length-1; i>=0; i--) {
                const b = bonuses[i];
                b.y += b.vy; b.bob += 0.1;
                if (b.y > canvas.height) { bonuses.splice(i,1); continue; }
                if (player.alive && b.x+b.w > player.x && b.x < player.x+player.w && b.y+b.h > player.y && b.y < player.y+player.h) {
                    applyBonus(b.type);
                    spawnExplosion(b.x+b.w/2, b.y+b.h/2, 15, '#00ff88');
                    bonuses.splice(i,1);
                }
            }
        }
        function applyBonus(type) {
            switch(type) {
                case 'speed': playerBonuses.speed = 300; break;
                case 'shield': playerBonuses.shield = 1; break;
                case 'power': playerBonuses.power = 300; break;
                case 'life': lives++; updateInfo(); break;
            }
            vibrate(50); playSound('bonus');
        }

        // ---------- Генерация РАНДОМНОЙ КАРТЫ ----------
        function loadLevel() {
            walls = [];
            nets = [];
            base = { x: 6*TILE, y: 12*TILE, w: TILE, h: TILE, alive: true };
            player.x = 1*TILE;
            player.y = 12*TILE;
            player.dir = 0;

            // Создаем логическую сетку для отслеживания занятых клеток
            const occupied = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
            const reserved = new Set();
            
            // Зарезервированные клетки (старт игрока, спавн врагов, база)
            reserved.add(`0,1`); reserved.add(`0,6`); reserved.add(`0,11`); // Спавн врагов
            reserved.add(`12,1`); // Старт игрока
            reserved.add(`12,6`); // База

            // Маркируем зарезервированные клетки
            reserved.forEach(key => {
                const [r, c] = key.split(',').map(Number);
                if(r >= 0 && r < ROWS && c >= 0 && c < COLS) occupied[r][c] = true;
            });

            // 1. Генерация стен (кирпич и сталь)
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (occupied[r][c]) continue;

                    // Используем настройки плотности из текущей сложности
                    if (Math.random() < settings.wallDensity) {
                        let type = 'brick', hp = 2;
                        if (Math.random() < settings.steelChance) {
                            type = 'steel'; hp = 999;
                        }
                        walls.push({ x: c * TILE, y: r * TILE, w: TILE, h: TILE, type, hp });
                        occupied[r][c] = true;
                    }
                }
            }

            // Дополнительная защита базы (всегда добавляем кирпичи над базой, чтобы её нельзя было расстрелять издалека)
            const baseDefense = [
                {r: 11, c: 5}, {r: 11, c: 6}, {r: 11, c: 7}
            ];
            for (let def of baseDefense) {
                if (!occupied[def.r][def.c]) {
                    walls.push({ x: def.c * TILE, y: def.r * TILE, w: TILE, h: TILE, type: 'brick', hp: 2 });
                    occupied[def.r][def.c] = true;
                }
            }

            // 2. Генерация маскировочных сеток (кустов)
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (occupied[r][c]) continue;
                    if (Math.random() < 0.25) {
                        nets.push({ x: c * TILE, y: r * TILE, w: TILE, h: TILE });
                    }
                }
            }
        }

        // ---------- Сохранения ----------
        function getSaveKey(diff) { return 'tanks_save_' + diff; }
        function saveGame() {
            const data = {
                difficulty: difficulty, score: score, lives: lives, currentRound: currentRound,
                enemiesSpawnedInRound: enemiesSpawnedInRound, enemiesKilledInRound: enemiesKilledInRound,
                enemiesPerRound: enemiesPerRound, playerBonuses: playerBonuses,
                player: { x: player.x, y: player.y, dir: player.dir, alive: player.alive },
            };
            if (gameOver) return;
            try { localStorage.setItem(getSaveKey(difficulty), JSON.stringify(data)); } catch(e) {}
        }
        function loadGame(diff) {
            try {
                const raw = localStorage.getItem(getSaveKey(diff));
                if (!raw) return null;
                return JSON.parse(raw);
            } catch(e) { return null; }
        }
        function clearSave(diff) {
            try { localStorage.removeItem(getSaveKey(diff)); } catch(e) {}
        }

        // ---------- Запуск раунда ----------
        function startNewRound() {
            loadLevel();
            player.alive = true; player.cooldown = 0; player.respawnTimer = 0;
            enemies = []; bullets = []; particles = []; bonuses = [];
            enemiesAlive = 0; enemiesSpawnedInRound = 0; enemiesKilledInRound = 0;
            roundComplete = false; spawnTimer = 0;
            
            enemiesPerRound = settings.enemiesPerRoundBase + (currentRound-1)*2;
            if (enemiesPerRound > 30) enemiesPerRound = 30;
            currentSpawnDelay = Math.max(20, settings.spawnDelay - currentRound * 2);
            
            if (currentRound > 1) { lives++; playSound('win'); vibrate(200); }
            updateInfo(); roundSpan.textContent = currentRound;
            updateProgressBar();
            saveGame();
        }

        function initGame(diff, loadFromSave) {
            difficulty = diff || difficulty;
            settings = DIFFICULTY_SETTINGS[difficulty];
            MAX_ENEMIES_ON_SCREEN = settings.maxEnemies;
            currentSpawnDelay = settings.spawnDelay;
            gameOver = false; win = false; particles = []; bonuses = [];
            playerBonuses = { speed:0, shield:0, power:0 };

            if (loadFromSave) {
                const saved = loadGame(difficulty);
                if (saved) {
                    score = saved.score; lives = saved.lives; currentRound = saved.currentRound;
                    enemiesSpawnedInRound = saved.enemiesSpawnedInRound;
                    enemiesKilledInRound = saved.enemiesKilledInRound;
                    enemiesPerRound = saved.enemiesPerRound; playerBonuses = saved.playerBonuses;
                    if (saved.player && saved.player.alive) {
                        player.x = saved.player.x; player.y = saved.player.y;
                        player.dir = saved.player.dir; player.alive = true;
                    } else {
                        player.x = 1*TILE; player.y = 12*TILE; player.dir = 0; player.alive = true;
                    }
                    player.cooldown = 0; player.respawnTimer = 0;
                    loadLevel(); enemies = []; bullets = []; enemiesAlive = 0;
                    roundComplete = false; spawnTimer = 0;
                    currentSpawnDelay = Math.max(20, settings.spawnDelay - currentRound * 2);
                    updateInfo(); roundSpan.textContent = currentRound;
                    updateProgressBar();
                    return;
                }
            }

            lives = settings.lives; score = 0; currentRound = 1;
            player.x = 1*TILE; player.y = 12*TILE; player.dir = 0; player.alive = true;
            player.cooldown = 0; player.respawnTimer = 0;
            loadLevel(); enemies = []; bullets = []; enemiesAlive = 0;
            enemiesSpawnedInRound = 0; enemiesKilledInRound = 0;
            roundComplete = false; spawnTimer = 0;
            enemiesPerRound = settings.enemiesPerRoundBase + (currentRound-1)*2;
            if (enemiesPerRound > 30) enemiesPerRound = 30;
            currentSpawnDelay = Math.max(20, settings.spawnDelay - currentRound * 2);
            updateInfo(); roundSpan.textContent = currentRound;
            updateProgressBar();
            clearSave(difficulty);
        }

        // ---------- Коллизии и спавн врагов ----------
        function collidesWithWalls(x,y,w,h) {
            for (let wl of walls) if (x < wl.x+wl.w && x+w > wl.x && y < wl.y+wl.h && y+h > wl.y) return true;
            return false;
        }
        function collidesWithBase(x,y,w,h) {
            if (!base || !base.alive) return false;
            return (x < base.x+base.w && x+w > base.x && y < base.y+base.h && y+h > base.y);
        }
        function collidesWithEnemies(x,y,w,h,exclude) {
            for (let e of enemies) if (e!==exclude && e.alive && x < e.x+e.w && x+w > e.x && y < e.y+e.h && y+h > e.y) return true;
            return false;
        }
        function collidesWithPlayer(x,y,w,h) {
            if (!player.alive) return false;
            return (x < player.x+player.w && x+w > player.x && y < player.y+player.h && y+h > player.y);
        }

        function spawnEnemy() {
            if (enemiesAlive >= MAX_ENEMIES_ON_SCREEN || gameOver || win || enemiesSpawnedInRound >= enemiesPerRound) return false;
            const spawnPoints = [{x:1*TILE,y:1*TILE},{x:6*TILE,y:1*TILE},{x:11*TILE,y:1*TILE}];
            let attempts = 0, pos = null;
            while (attempts < 10) {
                const idx = Math.floor(Math.random() * spawnPoints.length);
                const sp = spawnPoints[idx];
                let blocked = false;
                for (let e of enemies) if (e.alive && Math.abs(e.x-sp.x)<1.5*TILE && Math.abs(e.y-sp.y)<1.5*TILE) { blocked=true; break; }
                if (player.alive && Math.abs(player.x-sp.x)<1.5*TILE && Math.abs(player.y-sp.y)<1.5*TILE) blocked=true;
                if (!blocked) { pos = sp; break; }
                attempts++;
            }
            if (!pos) return false;
            
            let type = 'normal', hp = 1, speedMult = 1, fireRate = 1;
            let rnd = Math.random();
            
            let cShooter = Math.min(0.4, settings.shooterChance + (currentRound * 0.01));
            let cArmored = Math.min(0.5, settings.armoredChance + (currentRound * 0.01));
            let cFast = Math.min(0.6, settings.fastChance + (currentRound * 0.01));

            if (currentRound > 2 && rnd < cShooter) {
                type = 'shooter'; fireRate = 0.4; 
            } else if (currentRound > 3 && rnd < (cShooter + cArmored)) {
                type = 'armored'; hp = 2 + (currentRound > 10 ? 1 : 0);
            } else if (currentRound > 1 && rnd < (cShooter + cArmored + cFast)) {
                type = 'fast'; speedMult = 1.8; hp = 1; 
            }
            
            const speed = (ENEMY_BASE_SPEED * settings.enemySpeedMult + Math.random()*0.4 + currentRound*0.05) * speedMult;
            const enemy = { 
                x:pos.x, y:pos.y, w:TILE-2, h:TILE-2, 
                dir:2, speed:Math.min(speed,5.0), 
                alive:true, cooldown:0, moveDir:2, changeDirTimer:0, 
                hp, type, fireRate, aimTimer:0 
            };
            enemies.push(enemy); enemiesAlive++; enemiesSpawnedInRound++;
            
            spawnExplosion(pos.x + TILE/2, pos.y + TILE/2, 25, '#FFFFFF');
            return true;
        }

        function fireBullet(x,y,dir,owner,power) {
            let bx = x + TILE/2 - 7, by = y + TILE/2 - 7;
            let dx = 0, dy = 0;
            const size = power ? 20 : 14;
            const speed = power ? BULLET_SPEED*1.5 : BULLET_SPEED;
            switch(dir) {
                case 0: dy = -speed; bx = x+10; by = y-10; break;
                case 1: dx = speed; bx = x+TILE+2; by = y+10; break;
                case 2: dy = speed; bx = x+10; by = y+TILE+2; break;
                case 3: dx = -speed; bx = x-10; by = y+10; break;
            }
            bullets.push({ x:bx, y:by, w:size, h:size, dx, dy, dir, owner, power: power || false });
            playSound('fire'); vibrate(30);
        }

        // ---------- Обновление ----------
        function update() {
            if (gameOver || win) return;
            frame++;
            if (playerBonuses.speed > 0) playerBonuses.speed--;
            if (playerBonuses.power > 0) playerBonuses.power--;

            if (player.alive) {
                let moveX = 0, moveY = 0;
                if (joystickActive) {
                    const len = Math.hypot(joystickDir.x, joystickDir.y);
                    if (len > 0.2) {
                        const normX = joystickDir.x/len, normY = joystickDir.y/len;
                        const angle = Math.atan2(normY, normX);
                        const deg = angle * 180 / Math.PI;
                        if (deg > -45 && deg <= 45) { moveX = 1; player.dir = 1; }
                        else if (deg > 45 && deg <= 135) { moveY = 1; player.dir = 2; }
                        else if (deg > -135 && deg <= -45) { moveY = -1; player.dir = 0; }
                        else { moveX = -1; player.dir = 3; }
                    }
                }
                const currentSpeed = player.speed + (playerBonuses.speed > 0 ? 2 : 0);
                if (moveX || moveY) {
                    let newX = player.x + moveX * currentSpeed, newY = player.y + moveY * currentSpeed;
                    if (newX < 0) newX = 0; if (newX + player.w > canvas.width) newX = canvas.width - player.w;
                    if (newY < 0) newY = 0; if (newY + player.h > canvas.height) newY = canvas.height - player.h;
                    if (!collidesWithWalls(newX,newY,player.w,player.h) && !collidesWithBase(newX,newY,player.w,player.h) && !collidesWithEnemies(newX,newY,player.w,player.h,null)) {
                        player.x = newX; player.y = newY;
                    } else {
                        if (moveX) {
                            let tryX = player.x + moveX * currentSpeed;
                            if (tryX >= 0 && tryX+player.w <= canvas.width && !collidesWithWalls(tryX,player.y,player.w,player.h) && !collidesWithBase(tryX,player.y,player.w,player.h) && !collidesWithEnemies(tryX,player.y,player.w,player.h,null))
                                player.x = tryX;
                        }
                        if (moveY) {
                            let tryY = player.y + moveY * currentSpeed;
                            if (tryY >= 0 && tryY+player.h <= canvas.height && !collidesWithWalls(player.x,tryY,player.w,player.h) && !collidesWithBase(player.x,tryY,player.w,player.h) && !collidesWithEnemies(player.x,tryY,player.w,player.h,null))
                                player.y = tryY;
                        }
                    }
                }
                if (player.cooldown > 0) player.cooldown--;
                if (firePressed && player.cooldown === 0 && player.alive) {
                    fireBullet(player.x, player.y, player.dir, 'player', playerBonuses.power > 0);
                    player.cooldown = playerBonuses.power > 0 ? 6 : 12;
                }
            } else {
                player.respawnTimer--;
                if (player.respawnTimer <= 0 && lives > 0) {
                    player.alive = true; player.x = 1*TILE; player.y = 12*TILE; player.dir = 0;
                    spawnExplosion(player.x + TILE/2, player.y + TILE/2, 30);
                    if (collidesWithWalls(player.x,player.y,player.w,player.h)) {
                        player.y -= TILE; if (collidesWithWalls(player.x,player.y,player.w,player.h)) player.y += TILE*2;
                    }
                }
            }

            for (let e of enemies) {
                if (!e.alive) continue;
                e.changeDirTimer--;
                if (player.alive && Math.random() < settings.aiChaseChance * 0.1) {
                     const dx = player.x - e.x;
                     const dy = player.y - e.y;
                     if (Math.abs(dx) > Math.abs(dy)) e.moveDir = dx > 0 ? 1 : 3;
                     else e.moveDir = dy > 0 ? 2 : 0;
                     e.changeDirTimer = 15 + Math.random() * 20;
                }
                if (e.changeDirTimer <= 0) {
                    if (player.alive && Math.random() < settings.aiChaseChance) {
                        const dx = player.x - e.x, dy = player.y - e.y;
                        if (Math.abs(dx) > Math.abs(dy)) e.moveDir = dx > 0 ? 1 : 3;
                        else e.moveDir = dy > 0 ? 2 : 0;
                    } else {
                        e.moveDir = Math.floor(Math.random()*4);
                    }
                    e.changeDirTimer = 40 + Math.floor(Math.random()*60);
                }
                let dx = 0, dy = 0;
                switch(e.moveDir) {
                    case 0: dy = -e.speed; break;
                    case 1: dx = e.speed; break;
                    case 2: dy = e.speed; break;
                    case 3: dx = -e.speed; break;
                }
                let newX = e.x + dx, newY = e.y + dy;
                if (newX < 0) newX = 0; if (newX + e.w > canvas.width) newX = canvas.width - e.w;
                if (newY < 0) newY = 0; if (newY + e.h > canvas.height) newY = canvas.height - e.h;
                if (!collidesWithWalls(newX,newY,e.w,e.h) && !collidesWithBase(newX,newY,e.w,e.h) && !collidesWithEnemies(newX,newY,e.w,e.h,e) && !collidesWithPlayer(newX,newY,e.w,e.h)) {
                    e.x = newX; e.y = newY; e.dir = e.moveDir;
                } else {
                    e.changeDirTimer = 0;
                }
                if (e.cooldown > 0) e.cooldown--;
                if (e.type === 'shooter' && settings.aiChaseChance > 0.5 && player.alive) {
                     const px = player.x - e.x;
                     const py = player.y - e.y;
                     if (Math.abs(px) > Math.abs(py)) e.dir = px > 0 ? 1 : 3;
                     else e.dir = py > 0 ? 2 : 0;
                }
                const fireChance = (0.02 + currentRound*0.003) * settings.enemyFireRateMult;
                if (e.cooldown === 0 && e.alive && Math.random() < fireChance * (e.type === 'shooter' ? 2.5 : 1)) {
                    fireBullet(e.x, e.y, e.dir, 'enemy');
                    e.cooldown = Math.floor((45 + Math.random()*25) * (e.type === 'shooter' ? 0.4 : 1));
                }
            }

            if (!roundComplete && !gameOver) {
                spawnTimer--;
                if (spawnTimer <= 0 && enemiesAlive < MAX_ENEMIES_ON_SCREEN && enemiesSpawnedInRound < enemiesPerRound) {
                    if (spawnEnemy()) {
                        spawnTimer = Math.max(15, currentSpawnDelay - Math.min(currentRound*2, 40));
                    } else spawnTimer = 15;
                }
            }

            for (let i=bullets.length-1; i>=0; i--) {
                const b = bullets[i];
                b.x += b.dx; b.y += b.dy;
                let remove = false;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) remove = true;

                if (!remove) {
                    for (let j=walls.length-1; j>=0; j--) {
                        const w = walls[j];
                        if (b.x < w.x+w.w && b.x+b.w > w.x && b.y < w.y+w.h && b.y+b.h > w.y) {
                            if (w.type === 'brick') {
                                if (b.power) { walls.splice(j,1); }
                                else { w.hp--; if (w.hp <= 0) walls.splice(j,1); }
                                playSound('explode'); vibrate(50); spawnExplosion(w.x + TILE/2, w.y + TILE/2, 20);
                            }
                            remove = true; break;
                        }
                    }
                }
                if (!remove && base && base.alive) {
                    if (b.x < base.x+base.w && b.x+b.w > base.x && b.y < base.y+base.h && b.y+b.h > base.y) {
                        base.alive = false; remove = true; gameOver = true; playSound('gameover'); vibrate(300); spawnExplosion(base.x + TILE/2, base.y + TILE/2, 50);
                        clearSave(difficulty);
                    }
                }
                if (!remove && b.owner === 'enemy' && player.alive) {
                    if (b.x < player.x+player.w && b.x+b.w > player.x && b.y < player.y+player.h && b.y+b.h > player.y) {
                        if (playerBonuses.shield > 0) {
                            playerBonuses.shield = 0; spawnExplosion(player.x + TILE/2, player.y + TILE/2, 20, '#00aaff'); remove = true;
                        } else {
                            player.alive = false; lives--; player.respawnTimer = 90; remove = true;
                            playSound('damage'); vibrate(150); updateInfo(); spawnExplosion(player.x + TILE/2, player.y + TILE/2, 40);
                            if (lives <= 0) { gameOver = true; playSound('gameover'); vibrate(400); clearSave(difficulty); }
                        }
                    }
                }
                if (!remove && b.owner === 'player') {
                    for (let e of enemies) {
                        if (!e.alive) continue;
                        if (b.x < e.x+e.w && b.x+b.w > e.x && b.y < e.y+e.h && b.y+b.h > e.y) {
                            e.hp--;
                            if (e.hp <= 0) {
                                e.alive = false; enemiesAlive--; enemiesKilledInRound++;
                                score += Math.floor(10 * (settings.scoreMult || 1)) + currentRound * 2;
                                playSound('explode'); vibrate(80); spawnExplosion(e.x + TILE/2, e.y + TILE/2, 35);
                                dropBonus(e.x + TILE/2, e.y + TILE/2);
                                if (enemiesKilledInRound >= enemiesPerRound) {
                                    roundComplete = true; playSound('win'); vibrate(200);
                                    setTimeout(() => { if (!gameOver && !win) { currentRound++; startNewRound(); } }, 1500);
                                }
                            }
                            remove = true; updateInfo(); break;
                        }
                    }
                }
                if (remove) bullets.splice(i,1);
            }

            if (!roundComplete && !gameOver && enemiesAlive === 0 && enemiesSpawnedInRound >= enemiesPerRound) {
                roundComplete = true; playSound('win'); vibrate(200);
                setTimeout(() => { if (!gameOver && !win) { currentRound++; startNewRound(); } }, 1500);
            }

            updateParticles(); updateBonuses(); updateInfo(); updateProgressBar();
        }

        function updateInfo() { livesSpan.textContent = lives; roundSpan.textContent = currentRound; }
        function updateProgressBar() {
            const total = enemiesPerRound;
            const done = enemiesKilledInRound;
            const pct = total > 0 ? Math.min(100, (done / total) * 100) : 0;
            progressFill.style.width = pct + '%';
        }

        // ---------- ОТРИСОВКА ТАНКА ПО ПИКСЕЛЬ-АРТУ ----------
        function drawPixelTank(x, y, dir, isPlayer) {
            const s = 4; 
            const off = (TILE - 14 * s) / 2; 
            const cx = x + TILE/2;
            const cy = y + TILE/2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(dir * Math.PI / 2);
            ctx.translate(-TILE/2 + off, -TILE/2 + off);

            if (isPlayer) {
                const colorTrack = '#9B8244';
                const colorTrackAccent = '#F8A163';
                const colorBody = '#FFF29D';
                const colorTurret = '#FFB078';

                ctx.fillStyle = colorTrack;
                ctx.fillRect(0*s, 0*s, 2*s, 14*s);
                ctx.fillRect(12*s, 0*s, 2*s, 14*s);
                
                ctx.fillStyle = colorTrackAccent;
                for(let r=0; r<14; r+=3) {
                    ctx.fillRect(0*s, r*s, 2*s, 1*s);
                    ctx.fillRect(12*s, r*s, 2*s, 1*s);
                }
                
                ctx.fillStyle = colorBody;
                ctx.fillRect(2*s, 2*s, 10*s, 10*s);
                ctx.fillRect(2*s, 12*s, 10*s, 2*s);

                ctx.fillStyle = colorTurret;
                ctx.fillRect(3*s, 3*s, 8*s, 6*s);
                ctx.fillRect(4*s, 2*s, 6*s, 2*s);
                ctx.fillRect(2*s, 9*s, 10*s, 2*s);
                
                ctx.fillStyle = colorBody;
                ctx.fillRect(5*s, 4*s, 4*s, 2*s);
                ctx.fillRect(4*s, 6*s, 2*s, 2*s);
                ctx.fillRect(8*s, 6*s, 2*s, 2*s);

                ctx.fillStyle = colorBody;
                ctx.fillRect(6*s, 0*s, 2*s, 4*s);
            } else {
                const colorTrack = '#5C6670';
                const colorTrackAccent = '#C2CFD8';
                const colorBody = '#E6EEF5';
                const colorTurret = '#F57F8D';

                ctx.fillStyle = colorTrack;
                ctx.fillRect(0*s, 0*s, 2*s, 14*s);
                ctx.fillRect(12*s, 0*s, 2*s, 14*s);
                
                ctx.fillStyle = colorTrackAccent;
                for(let r=0; r<14; r+=3) {
                    ctx.fillRect(0*s, r*s, 2*s, 1*s);
                    ctx.fillRect(12*s, r*s, 2*s, 1*s);
                }
                
                ctx.fillStyle = colorBody;
                ctx.fillRect(2*s, 2*s, 10*s, 10*s);
                ctx.fillRect(2*s, 12*s, 10*s, 2*s);

                ctx.fillStyle = colorTurret;
                ctx.fillRect(3*s, 3*s, 8*s, 6*s);
                ctx.fillRect(4*s, 2*s, 6*s, 2*s);
                ctx.fillRect(2*s, 9*s, 10*s, 2*s);
                
                ctx.fillStyle = colorBody;
                ctx.fillRect(5*s, 4*s, 4*s, 2*s);
                ctx.fillRect(4*s, 6*s, 2*s, 2*s);
                ctx.fillRect(8*s, 6*s, 2*s, 2*s);

                ctx.fillStyle = colorBody;
                ctx.fillRect(6*s, 0*s, 2*s, 4*s);
            }

            ctx.restore();
        }

        // ---------- Основной цикл рисования ----------
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,canvas.width,canvas.height);

            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            for (let w of walls) {
                if (w.type === 'brick') {
                    ctx.fillStyle = '#B85A30'; 
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                    
                    const bw = w.w/4, bh = w.h/4;
                    for (let r=0; r<4; r++) for (let c=0; c<4; c++) {
                        const bx = w.x + c*bw, by = w.y + r*bh;
                        ctx.fillStyle = ((r+c)%2===0) ? '#C96A3A' : '#D67A48';
                        ctx.fillRect(bx+2, by+2, bw-4, bh-4);
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.fillRect(bx+2, by+bh-3, bw-4, 2);
                        ctx.fillRect(bx+bw-3, by+2, 2, bh-4);
                    }
                } else if (w.type === 'steel') {
                    ctx.fillStyle = '#75828F'; 
                    ctx.fillRect(w.x, w.y, w.w, w.h);
                    ctx.strokeStyle = '#A5B2C0';
                    ctx.lineWidth = 2;
                    
                    const bw = w.w/2, bh = w.h/2;
                    for (let r=0; r<2; r++) for (let c=0; c<2; c++) {
                        ctx.strokeRect(w.x + c*bw + 2, w.y + r*bh + 2, bw-4, bh-4);
                    }
                    ctx.fillStyle = '#9AA7B5';
                    ctx.fillRect(w.x+4, w.y+4, 4, 4);
                }
            }

            if (base && base.alive) {
                ctx.fillStyle = '#FFF29D'; ctx.fillRect(base.x, base.y, base.w, base.h);
                ctx.fillStyle = '#9B8244';
                ctx.font = 'bold 40px "Courier New"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('★', base.x+base.w/2, base.y+base.h/2);
                ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.strokeRect(base.x, base.y, base.w, base.h);
            } else if (base && !base.alive) {
                ctx.fillStyle = '#2a2a2a'; ctx.fillRect(base.x, base.y, base.w, base.h);
                ctx.fillStyle = '#555'; ctx.font = 'bold 40px "Courier New"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('✕', base.x+base.w/2, base.y+base.h/2);
                ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.strokeRect(base.x, base.y, base.w, base.h);
            }

            for (let e of enemies) {
                if (!e.alive) continue;
                drawPixelTank(e.x, e.y, e.dir, false);
            }

            if (player.alive) {
                drawPixelTank(player.x, player.y, player.dir, true);
                if (playerBonuses.shield > 0) {
                    ctx.strokeStyle = 'rgba(0, 170, 255, 0.6)'; ctx.lineWidth = 2;
                    ctx.shadowColor = '#00aaff'; ctx.shadowBlur = 12;
                    ctx.strokeRect(player.x-2, player.y-2, player.w+4, player.h+4);
                    ctx.shadowBlur = 0;
                }
            }

            for (let n of nets) {
                const cs = 6; 
                for (let r = 0; r < TILE; r += cs) {
                    for (let c = 0; c < TILE; c += cs) {
                        if ((Math.floor(r/cs) + Math.floor(c/cs)) % 2 === 0) {
                            ctx.fillStyle = '#2d5a1e';
                        } else {
                            ctx.fillStyle = '#4c7a3c';
                        }
                        ctx.fillRect(n.x + c, n.y + r, cs, cs);
                    }
                }
                for (let k = 0; k < 6; k++) {
                    let px = Math.random() * TILE, py = Math.random() * TILE;
                    ctx.fillStyle = '#6b4c2a';
                    ctx.fillRect(n.x + px - 3, n.y + py - 3, 6, 6);
                }
            }

            for (let b of bullets) {
                ctx.shadowColor = '#FFFFFF';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(b.x+1, b.y+1, b.w-2, b.h-2);
                ctx.fillStyle = '#FFCC00';
                ctx.fillRect(b.x+2, b.y+2, b.w-4, b.h-4);
                ctx.shadowBlur = 0;
            }

            for (let b of bonuses) {
                const bob = Math.sin(b.bob) * 3;
                ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                let icon = '?';
                if (b.type === 'speed') icon = '⚡';
                else if (b.type === 'shield') icon = '🛡️';
                else if (b.type === 'power') icon = '💥';
                else if (b.type === 'life') icon = '❤️';
                ctx.fillStyle = '#fff';
                ctx.fillText(icon, b.x + b.w/2, b.y + b.h/2 + bob);
            }

            drawParticles();

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 56px "Courier New"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 40);
                ctx.fillStyle = '#aaa'; ctx.font = '24px "Courier New"'; ctx.fillText('tap to continue', canvas.width/2, canvas.height/2 + 50);
            } else if (roundComplete && !gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 52px "Courier New"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('ROUND COMPLETE!', canvas.width/2, canvas.height/2 - 20);
                ctx.fillStyle = '#ccc'; ctx.font = '24px "Courier New"'; ctx.fillText('Next round starting...', canvas.width/2, canvas.height/2 + 50);
            }
        }

        function gameLoop() {
            if (!gameOver && !win) update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- Управление меню ----------
        function showMenu() {
            menuScreen.style.display = 'flex';
            loadOverlay.style.display = 'none';
        }
        function hideMenu() {
            menuScreen.style.display = 'none';
        }

        toggleOptions.forEach(opt => {
            opt.addEventListener('click', function() {
                toggleOptions.forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                difficulty = this.dataset.value;
            });
        });

        btnStart.addEventListener('click', () => {
            initAudio();
            const diff = difficulty; 
            const saved = loadGame(diff);
            if (saved) {
                loadOverlay.style.display = 'flex';
                pendingDiff = diff;
            } else {
                startGameWithDifficulty(diff, false);
            }
        });

        let pendingDiff = null;

        function startGameWithDifficulty(diff, loadFromSave) {
            initGame(diff, loadFromSave);
            hideMenu();
            gameOver = false; win = false;
            updateInfo(); updateProgressBar();
        }

        loadYes.addEventListener('click', () => {
            loadOverlay.style.display = 'none';
            if (pendingDiff) startGameWithDifficulty(pendingDiff, true);
        });
        loadNo.addEventListener('click', () => {
            loadOverlay.style.display = 'none';
            if (pendingDiff) { clearSave(pendingDiff); startGameWithDifficulty(pendingDiff, false); }
        });

        canvas.addEventListener('click', () => {
            if (gameOver) {
                showMenu();
                gameOver = false;
            }
        });
        canvas.addEventListener('touchend', (e) => {
            if (gameOver) {
                e.preventDefault();
                showMenu();
                gameOver = false;
            }
        });

        // ---------- Управление ----------
        let joystickActive = false, joystickDir = {x:0,y:0}, firePressed = false;
        const joystickEl = document.getElementById('joystick');
        const knob = document.getElementById('joystickKnob');
        const fireBtn = document.getElementById('fireBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const closeBtn = document.getElementById('closeBtn');

        let jcx=0, jcy=0, jr=0;
        function updateJoystickPos() {
            const rect = joystickEl.getBoundingClientRect();
            jcx = rect.left + rect.width/2; jcy = rect.top + rect.height/2; jr = rect.width/2 - 12;
        }
        function handleJoystick(clientX, clientY) {
            updateJoystickPos();
            let dx = clientX - jcx, dy = clientY - jcy;
            const dist = Math.hypot(dx, dy);
            if (dist < 10) { joystickActive = false; joystickDir = {x:0,y:0}; knob.style.transform = 'translate(-50%, -50%)'; return; }
            joystickActive = true;
            let clampedDist = Math.min(dist, jr);
            let angle = Math.atan2(dy, dx);
            let kx = Math.cos(angle) * clampedDist, ky = Math.sin(angle) * clampedDist;
            knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
            const norm = Math.max(Math.abs(kx), Math.abs(ky), 1);
            joystickDir = { x: kx / norm, y: ky / norm };
        }
        function resetJoystick() { joystickActive = false; joystickDir = {x:0,y:0}; knob.style.transform = 'translate(-50%, -50%)'; }

        joystickEl.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; handleJoystick(t.clientX, t.clientY); });
        joystickEl.addEventListener('touchmove', e => { e.preventDefault(); const t = e.changedTouches[0]; handleJoystick(t.clientX, t.clientY); });
        joystickEl.addEventListener('touchend', e => { e.preventDefault(); resetJoystick(); });
        joystickEl.addEventListener('touchcancel', e => { e.preventDefault(); resetJoystick(); });

        fireBtn.addEventListener('touchstart', e => { e.preventDefault(); firePressed = true; initAudio(); });
        fireBtn.addEventListener('touchend', e => { e.preventDefault(); firePressed = false; });
        fireBtn.addEventListener('touchcancel', e => { e.preventDefault(); firePressed = false; });

        joystickEl.addEventListener('mousedown', e => { handleJoystick(e.clientX, e.clientY); });
        window.addEventListener('mousemove', e => { if (e.buttons & 1) handleJoystick(e.clientX, e.clientY); });
        window.addEventListener('mouseup', resetJoystick);
        fireBtn.addEventListener('mousedown', () => { firePressed = true; initAudio(); });
        fireBtn.addEventListener('mouseup', () => { firePressed = false; });

        fullscreenBtn.addEventListener('click', () => {
            initAudio();
            if (tg) {
                if (!tg.isFullscreen) tg.requestFullscreen();
                else tg.exitFullscreen();
            } else {
                if (!document.fullscreenElement) {
                    const el = document.documentElement;
                    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
                    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            }
        });

        closeBtn.addEventListener('click', () => { initAudio(); if (tg) tg.close(); });
        document.addEventListener('touchmove', e => { if (e.target.closest('.game-wrapper')) e.preventDefault(); }, { passive: false });

        // ---------- Запуск ----------
        showMenu();
        initGame('normal', false);
        gameLoop();
    })();
</script>
</body>
</html>
