<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CYBER_CORE // by NeBro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --symbol-size: 110px;
            --reel-height: 330px;
            --font-scale: 1;
            --neon-blue: #00f0ff;
            --neon-pink: #ff0055;
            --neon-gold: #ffaa00;
        }

        @media (max-width: 430px) {
            :root {
                --symbol-size: 90px;
                --reel-height: 270px;
                --font-scale: 0.85;
            }
        }

        @media (max-width: 360px) {
            :root {
                --symbol-size: 76px;
                --reel-height: 228px;
                --font-scale: 0.75;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }
        
        body {
            background: #020612;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--neon-blue);
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: grid-move 20s linear infinite;
            z-index: 0;
        }
        
        @keyframes grid-move {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* --- SPLASH SCREEN --- */
        .splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #020612;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .splash-screen.hidden {
            opacity: 0;
            transform: scale(1.15);
            pointer-events: none;
        }
        .splash-content {
            position: relative;
            background: rgba(4, 10, 22, 0.95);
            border: 1px solid #005577;
            border-left: 4px solid var(--neon-blue);
            padding: 40px 30px;
            text-align: center;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.1);
            max-width: 90%;
            width: 380px;
        }
        .splash-title {
            font-size: 32px;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            margin-bottom: 5px;
            letter-spacing: 4px;
        }
        .splash-subtitle {
            font-size: 14px;
            color: #5294a8;
            letter-spacing: 6px;
            margin-bottom: 40px;
        }
        .sys-loading {
            font-size: 12px;
            color: var(--neon-pink);
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        .enter-btn {
            width: 100%;
            height: 60px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--neon-blue);
            background: linear-gradient(135deg, #002b3d 0%, #001322 100%);
            clip-path: polygon(0 0, 90% 0, 100% 30%, 100% 100%, 10% 100%, 0 70%);
            border: none;
            border-right: 2px solid var(--neon-blue);
            border-top: 2px solid var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
            cursor: pointer;
            transition: all 0.2s;
            animation: pulse-border 2s infinite alternate;
        }
        .enter-btn:hover { background: linear-gradient(135deg, #00425e 0%, #001f33 100%); }
        .enter-btn:active { background: var(--neon-blue); color: #000; transform: scale(0.97); }
        
        @keyframes pulse-border {
            from { box-shadow: 0 0 10px rgba(0, 240, 255, 0.1); filter: drop-shadow(0 0 2px var(--neon-blue)); }
            to { box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); filter: drop-shadow(0 0 8px var(--neon-blue)); }
        }

        /* --- MAIN UI --- */
        .wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: calc(16px * var(--font-scale));
            position: relative;
            z-index: 1;
        }

        .cyber-bracket {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid var(--neon-blue);
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 0 3px var(--neon-blue));
        }
        .tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .system-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: calc(-10px * var(--font-scale));
            position: relative;
            z-index: 5;
        }
        .sys-title {
            font-size: calc(10px * var(--font-scale));
            color: #5294a8;
            letter-spacing: 2px;
        }
        .sound-btn {
            background: rgba(0, 34, 51, 0.8);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-size: calc(10px * var(--font-scale));
            padding: 4px 10px;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: all 0.2s;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }
        .sound-btn.muted {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            text-shadow: 0 0 5px rgba(255, 0, 85, 0.5);
            background: rgba(51, 0, 17, 0.8);
        }

        .display-screen {
            background: rgba(4, 10, 22, 0.95);
            border: 1px solid #005577;
            border-left: 4px solid var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.1);
            border-radius: 4px;
            padding: calc(14px * var(--font-scale)) 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .display-screen::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 240, 255, 0.05) 50%);
            background-size: 100% 4px;
            z-index: 5;
            pointer-events: none;
        }

        .screen-segment {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .screen-label {
            font-size: calc(9px * var(--font-scale));
            font-weight: bold;
            letter-spacing: 2px;
            color: #5294a8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .screen-value {
            font-size: calc(26px * var(--font-scale));
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            transition: color 0.3s ease;
        }
        .screen-divider {
            width: 1px;
            height: calc(40px * var(--font-scale));
            background: rgba(0, 240, 255, 0.2);
        }
        
        #winDisplay { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }

        .screen-win-active {
            border-color: var(--neon-pink) !important;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4), inset 0 0 20px rgba(255, 0, 85, 0.2) !important;
            animation: win-pulse 1s infinite alternate;
        }
        
        @keyframes win-pulse {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        /* --- SLOT MACHINE --- */
        .slot-machine {
            background: linear-gradient(180deg, #060e1a 0%, #03070f 100%);
            border: 1px solid #005577;
            padding: calc(20px * var(--font-scale));
            display: flex;
            flex-direction: column;
            gap: calc(20px * var(--font-scale));
            position: relative;
        }
        
        .telemetry-bar {
            display: flex;
            justify-content: space-between;
            font-size: calc(8px * var(--font-scale));
            color: #005577;
            letter-spacing: 1px;
            margin-top: calc(-10px * var(--font-scale));
            border-top: 1px solid rgba(0, 85, 119, 0.3);
            padding-top: 5px;
        }

        .reels-container {
            display: flex;
            gap: calc(12px * var(--font-scale));
            justify-content: center;
        }
        .reel {
            width: calc(var(--symbol-size) + 6px);
            height: var(--reel-height);
            background: #010307;
            border: 1px solid #005577;
            box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.15);
            overflow: hidden;
            position: relative;
        }
        
        .reel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, #010307 0%, transparent 15%, transparent 85%, #010307 100%);
            pointer-events: none;
            z-index: 5;
        }
        
        .reel-strip {
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }
        .symbol {
            width: var(--symbol-size);
            height: var(--symbol-size);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--symbol-size) * 0.5);
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }
        
        .symbol.win-highlight {
            animation: target-lock 0.5s ease-in-out infinite alternate;
            background: rgba(255, 0, 85, 0.15);
            z-index: 4;
            border-radius: 10px;
        }
        @keyframes target-lock {
            from { box-shadow: inset 0 0 10px var(--neon-pink), 0 0 5px rgba(255, 0, 85, 0.3); transform: scale(1); }
            to { box-shadow: inset 0 0 25px var(--neon-pink), 0 0 20px rgba(255, 0, 85, 0.8); transform: scale(1.08); }
        }

        /* --- CONTROLS --- */
        .controls { display: flex; flex-direction: column; gap: calc(14px * var(--font-scale)); }
        .bet-row { display: flex; align-items: center; gap: calc(10px * var(--font-scale)); }
        
        .cyber-btn-cut {
            cursor: pointer;
            border: none;
            background: #002233;
            color: var(--neon-blue);
            font-weight: 900;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
            position: relative;
            transition: all 0.1s ease;
        }
        
        .bet-btn {
            width: calc(48px * var(--font-scale));
            height: calc(48px * var(--font-scale));
            font-size: calc(24px * var(--font-scale));
            clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
            border-left: 2px solid var(--neon-blue);
            border-bottom: 2px solid var(--neon-blue);
        }
        .bet-btn:active { background: var(--neon-blue); color: #000; transform: scale(0.95); }
        
        .bet-display {
            flex: 1;
            text-align: center;
            font-size: calc(22px * var(--font-scale));
            font-weight: 800;
            padding: calc(10px * var(--font-scale)) 0;
            background: rgba(1, 5, 12, 0.9);
            border: 1px dashed #005577;
            color: var(--neon-blue);
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .action-row { display: flex; gap: calc(10px * var(--font-scale)); align-items: center; }
        
        .spin-btn {
            flex: 1;
            height: calc(56px * var(--font-scale));
            font-size: calc(20px * var(--font-scale));
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #002b3d 0%, #001322 100%);
            clip-path: polygon(0 0, 85% 0, 100% 30%, 100% 100%, 15% 100%, 0 70%);
            border-right: 2px solid var(--neon-blue);
            border-top: 2px solid var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
        }
        .spin-btn:active:not(:disabled) { background: var(--neon-blue); color: #000; transform: scale(0.96); }
        .spin-btn:disabled { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        
        .auto-btn, .stop-btn {
            width: calc(110px * var(--font-scale));
            height: calc(56px * var(--font-scale));
            font-size: calc(14px * var(--font-scale));
            letter-spacing: 1px;
            clip-path: polygon(15% 0, 100% 0, 100% 70%, 85% 100%, 0 100%, 0 30%);
            border-left: 2px solid var(--neon-blue);
            border-bottom: 2px solid var(--neon-blue);
        }
        .stop-btn {
            background: #2b0016; color: var(--neon-pink); border-color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink); box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
            display: none;
        }

        .bonus-btn {
            flex: 1;
            height: calc(56px * var(--font-scale));
            font-size: calc(14px * var(--font-scale));
            letter-spacing: 1px;
            font-weight: 900;
            background: #261c00; color: var(--neon-gold); border: 1px solid var(--neon-gold);
            clip-path: polygon(0 0, 85% 0, 100% 30%, 100% 100%, 15% 100%, 0 70%);
            display: none;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3); text-shadow: 0 0 5px var(--neon-gold);
            animation: cyber-pulse-amber 1s infinite alternate;
        }
        @keyframes cyber-pulse-amber {
            from { opacity: 0.8; box-shadow: 0 0 10px rgba(255, 170, 0, 0.2); }
            to { opacity: 1; box-shadow: 0 0 25px rgba(255, 170, 0, 0.6); }
        }

        .speed-row { display: flex; justify-content: center; }
        .speed-toggle {
            padding: calc(6px * var(--font-scale)) calc(20px * var(--font-scale));
            background: rgba(0, 34, 51, 0.6); border: 1px solid #005577;
            color: var(--neon-blue); font-size: calc(16px * var(--font-scale));
            cursor: pointer; letter-spacing: 2px; min-width: 85px; text-align: center;
            clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 100%, 0% 100%);
            transition: all 0.2s;
        }
        .speed-toggle.active {
            background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); font-weight: bold;
        }
    </style>
</head>
<body>

<div id="splashScreen" class="splash-screen">
    <div class="splash-content">
        <div class="cyber-bracket tl"></div><div class="cyber-bracket tr"></div>
        <div class="cyber-bracket bl"></div><div class="cyber-bracket br"></div>
        <h1 class="splash-title">CYBER_CORE</h1>
        <p class="splash-subtitle">SLOT-BOT v4.5</p>
        <div class="sys-loading">
            <span>SYSTEM BOOTING</span><span class="blink">_</span>
        </div>
        <button id="enterSystemBtn" class="enter-btn">INITIALIZE</button>
    </div>
</div>

<div class="wrapper">
    <div class="system-bar">
        <span class="sys-title">CYBER_CORE // v4.5</span>
        <button id="soundToggle" class="sound-btn">SND: ON</button>
    </div>

    <div class="display-screen">
        <div class="cyber-bracket tl"></div><div class="cyber-bracket tr"></div>
        <div class="cyber-bracket bl"></div><div class="cyber-bracket br"></div>
        
        <div class="screen-segment">
            <span class="screen-label">CORE_BALANCE</span>
            <span class="screen-value" id="balanceDisplay">₴1 000</span>
        </div>
        <div class="screen-divider"></div>
        <div class="screen-segment">
            <span class="screen-label" id="statusLabel">WIN_INDEX</span>
            <span class="screen-value" id="winDisplay">₴0</span>
        </div>
    </div>

    <div class="slot-machine">
        <div class="cyber-bracket tl"></div><div class="cyber-bracket tr"></div>
        <div class="cyber-bracket bl"></div><div class="cyber-bracket br"></div>

        <div class="reels-container">
            <div class="reel" id="reel1"><div class="reel-strip"></div></div>
            <div class="reel" id="reel2"><div class="reel-strip"></div></div>
            <div class="reel" id="reel3"><div class="reel-strip"></div></div>
        </div>

        <div class="controls">
            <div class="bet-row">
                <button class="cyber-btn-cut bet-btn" id="minusBet">−</button>
                <div class="bet-display" id="betDisplay">₴5</div>
                <button class="cyber-btn-cut bet-btn" id="plusBet">+</button>
            </div>

            <div class="action-row">
                <button class="cyber-btn-cut spin-btn" id="spinButton">SPIN</button>
                <button class="cyber-btn-cut auto-btn" id="autoButton">AUTO</button>
                <button class="cyber-btn-cut stop-btn" id="stopButton">STOP</button>
                <button class="cyber-btn-cut bonus-btn" id="bonusButton">REBOOT (+₴1000)</button>
            </div>

            <div class="speed-row">
                <button class="speed-toggle" id="speedToggle">❯</button>
            </div>
        </div>
        
        <div class="telemetry-bar">
            <span>SYS_STATUS: OK</span>
            <span>MATRIX_LINK: ACTIVE</span>
        </div>
    </div>
</div>

<script>
    (function() {
        // Единый конфигурационный объект (Фикс 1 & 2: Удобство + Настроенный RTP)
        const SYMBOL_CONFIG = {
            "🍒": { mult: 3, weight: 30 },
            "🍋": { mult: 4, weight: 25 },
            "🍇": { mult: 5, weight: 20 },
            "🔔": { mult: 8, weight: 15 },
            "⭐": { mult: 15, weight: 8 },
            "💎": { mult: 30, weight: 4 },
            "7️⃣": { mult: 100, weight: 2 }
        };

        const CELLS_PER_REEL = 30; 
        const VISIBLE_ROWS = 3;
        const BASE_DURATIONS = [900, 1300, 1700];
        
        const PAYLINES = [
            [0,0,0], [1,1,1], [2,2,2], 
            [0,1,2], [2,1,0]           
        ];

        const WEIGHTED_POOL = [];
        for (const [sym, config] of Object.entries(SYMBOL_CONFIG)) {
            for (let i = 0; i < config.weight; i++) WEIGHTED_POOL.push(sym);
        }

        const fmtMoney = (val) => `₴${val.toLocaleString('ru-RU')}`;

        // --- CYBERPUNK АУДИОДВИЖОК ---
        let isMuted = localStorage.getItem('slot_muted') === 'true';
        
        const AudioFX = {
            ctx: null,
            init() {
                if (isMuted) return;
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            
            playAdvanced(type, freq1, freq2, duration, vol = 0.1, type2 = null, detune = 0) {
                if (isMuted || !this.ctx) return;
                const t = this.ctx.currentTime;
                
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(vol, t + 0.02); 
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration); 

                const playOsc = (wType, f1, f2, dt) => {
                    const osc = this.ctx.createOscillator();
                    osc.type = wType;
                    osc.frequency.setValueAtTime(f1, t);
                    if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + duration);
                    if (dt) osc.detune.value = dt;
                    osc.connect(gain);
                    osc.start(t);
                    osc.stop(t + duration);
                };

                playOsc(type, freq1, freq2);
                if (type2) playOsc(type2, freq1, freq2, detune);

                gain.connect(this.ctx.destination);
            },

            boot() {
                this.playAdvanced('sine', 523.25, null, 0.4, 0.06, 'triangle', 1);
                setTimeout(() => this.playAdvanced('sine', 659.25, null, 0.4, 0.06, 'triangle', 1), 100);
                setTimeout(() => this.playAdvanced('sine', 783.99, null, 0.4, 0.06, 'triangle', 1), 200);
                setTimeout(() => this.playAdvanced('sine', 1046.50, null, 1.2, 0.08, 'triangle', 2), 300);
            },
            click() {
                this.playAdvanced('square', 800, 100, 0.06, 0.04);
            },
            spin() {
                this.playAdvanced('sawtooth', 300, 50, 0.1, 0.03, 'square', -5);
            },
            win() {
                const baseFreqs = [261.63, 329.63, 392.00, 523.25]; 
                baseFreqs.forEach((freq, i) => {
                    setTimeout(() => {
                        this.playAdvanced('triangle', freq * 0.5, freq, 0.6, 0.08, 'sine', 5);
                    }, i * 60);
                });
                setTimeout(() => {
                     this.playAdvanced('square', 523.25, 1046.50, 0.8, 0.06, 'sawtooth', 12);
                }, 300);
            },
            bonus() {
                this.playAdvanced('sawtooth', 150, 600, 0.3, 0.08, 'square', -10);
                setTimeout(() => this.playAdvanced('sine', 600, 1200, 0.4, 0.08), 300);
            }
        };

        // --- DOM Элементы ---
        const splashScreen = document.getElementById('splashScreen');
        const enterSystemBtn = document.getElementById('enterSystemBtn');
        const displayScreen = document.querySelector('.display-screen');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const statusLabel = document.getElementById('statusLabel');
        const winDisplay = document.getElementById('winDisplay');
        const betDisplay = document.getElementById('betDisplay');
        const spinButton = document.getElementById('spinButton');
        const autoButton = document.getElementById('autoButton');
        const stopButton = document.getElementById('stopButton');
        const bonusButton = document.getElementById('bonusButton');
        const speedToggle = document.getElementById('speedToggle');
        const soundToggle = document.getElementById('soundToggle');

        const reelStrips = [
            document.querySelector('#reel1 .reel-strip'),
            document.querySelector('#reel2 .reel-strip'),
            document.querySelector('#reel3 .reel-strip')
        ];

        let balance = parseInt(localStorage.getItem('slot_balance'));
        if (isNaN(balance) || balance < 0) balance = 1000;
        
        let bet = parseInt(localStorage.getItem('slot_bet'));
        if (isNaN(bet) || bet < 5 || bet > 5000 || bet % 5 !== 0) bet = 5;

        let isSpinning = false;
        let autoMode = false;
        let autoSpinTimer = null; // Таймер для безопасной остановки авто-спина
        
        const speedLevels = [
            { text: '❯', speed: 1.0 },
            { text: '❯❯', speed: 1.5 },
            { text: '❯❯❯', speed: 2.2 }
        ];
        let currentSpeedIndex = 0;
        let currentSpeed = speedLevels[0].speed;

        // --- Обработчики интерфейса ---
        enterSystemBtn.addEventListener('click', () => {
            AudioFX.init();
            if (!isMuted) AudioFX.boot();
            if (navigator.vibrate && !isMuted) navigator.vibrate([50, 100, 150]);
            splashScreen.classList.add('hidden');
            setTimeout(() => splashScreen.style.display = 'none', 600);
        });

        function updateSoundButton() {
            soundToggle.textContent = isMuted ? 'SND: OFF' : 'SND: ON';
            soundToggle.classList.toggle('muted', isMuted);
        }
        
        soundToggle.addEventListener('click', () => {
            isMuted = !isMuted;
            localStorage.setItem('slot_muted', isMuted);
            updateSoundButton();
            if (!isMuted) { AudioFX.init(); AudioFX.click(); }
        });
        updateSoundButton();

        function weightedRandom() {
            return WEIGHTED_POOL[Math.floor(Math.random() * WEIGHTED_POOL.length)];
        }

        function buildAllStrips() {
            reelStrips.forEach(strip => {
                strip.innerHTML = '';
                for (let i = 0; i < CELLS_PER_REEL; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'symbol';
                    cell.textContent = weightedRandom();
                    strip.appendChild(cell);
                }
            });
        }

        function updateUI() {
            // Фикс 3: Умное снижение ставки, если баланс упал ниже текущей ставки, но деньги еще есть
            if (balance < bet && balance >= 5 && !isSpinning) {
                bet = Math.floor(balance / 5) * 5;
            }

            balanceDisplay.textContent = fmtMoney(balance);
            betDisplay.textContent = fmtMoney(bet);
            localStorage.setItem('slot_balance', balance);
            localStorage.setItem('slot_bet', bet);

            if (balance < 5 && !isSpinning) { 
                // Баланс полностью пуст — показываем кнопку ребута
                spinButton.style.display = 'none';
                autoButton.style.display = 'none';
                stopButton.style.display = 'none';
                bonusButton.style.display = 'block';
                if (autoMode) stopAutoMode();
            } else if (!autoMode) {
                // Стандартный интерфейс
                spinButton.style.display = 'block';
                autoButton.style.display = 'block';
                stopButton.style.display = 'none';
                bonusButton.style.display = 'none';
                spinButton.disabled = isSpinning || balance < bet;
            }
        }

        function updateSpeedButton() {
            speedToggle.textContent = speedLevels[currentSpeedIndex].text;
            speedToggle.classList.toggle('active', currentSpeedIndex !== 0);
        }

        function generateResultMatrix() {
            return Array.from({length: 3}, () => 
                Array.from({length: VISIBLE_ROWS}, () => weightedRandom())
            );
        }

        function spinReel(strip, duration, targetSymbols) {
            return new Promise(resolve => {
                const symbolElements = strip.querySelectorAll('.symbol');
                const symbolHeight = symbolElements[0].getBoundingClientRect().height; 

                symbolElements[0].textContent = targetSymbols[0];
                symbolElements[1].textContent = targetSymbols[1];
                symbolElements[2].textContent = targetSymbols[2];

                for (let i = 3; i < CELLS_PER_REEL; i++) {
                    symbolElements[i].textContent = weightedRandom();
                }

                strip.style.filter = 'blur(4px) contrast(1.2)';
                
                const totalTicks = 6;
                for(let t=0; t<totalTicks; t++) {
                    setTimeout(() => { if(isSpinning) AudioFX.spin(); }, (duration / totalTicks) * t);
                }

                const startTime = performance.now();
                const totalDistance = (CELLS_PER_REEL - 3) * symbolHeight;

                strip.style.transform = `translateY(-${totalDistance}px)`;

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 4); 
                    
                    const offset = -totalDistance * (1 - eased);
                    strip.style.transform = `translateY(${offset}px)`;

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        strip.style.filter = 'blur(0px)';
                        strip.style.transform = 'translateY(0px)';
                        resolve();
                    }
                }
                requestAnimationFrame(animate);
            });
        }

        function checkWins(matrix) {
            const wins = [];
            for (let l = 0; l < PAYLINES.length; l++) {
                const [r0, r1, r2] = PAYLINES[l];
                const s0 = matrix[0][r0], s1 = matrix[1][r1], s2 = matrix[2][r2];
                if (s0 === s1 && s1 === s2) {
                    wins.push({ lineIndex: l, symbol: s0, multiplier: SYMBOL_CONFIG[s0].mult });
                }
            }
            return wins;
        }

        function highlightWinningSymbols(wins) {
            document.querySelectorAll('.symbol').forEach(el => el.classList.remove('win-highlight'));
            if (wins.length === 0) return;

            wins.forEach(w => {
                PAYLINES[w.lineIndex].forEach((row, col) => {
                    const symbols = reelStrips[col].querySelectorAll('.symbol');
                    if (symbols[row]) symbols[row].classList.add('win-highlight');
                });
            });

            setTimeout(() => {
                document.querySelectorAll('.symbol.win-highlight').forEach(el => el.classList.remove('win-highlight'));
            }, 2000);
        }

        function spawnConfetti() {
            const colors = ['#00f0ff', '#ff0055', '#ffaa00', '#76ff03', '#ffffff'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.style.cssText = `
                    position: fixed; left: ${Math.random() * 100}vw; top: -20px;
                    width: ${5 + Math.random() * 6}px; height: ${5 + Math.random() * 6}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    pointer-events: none; z-index: 9999;
                `;
                document.body.appendChild(confetti);
                const animation = confetti.animate([
                    { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
                    { transform: `translateY(${window.innerHeight + 100}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], { duration: 1200 + Math.random() * 1000, easing: 'ease-in' });
                animation.onfinish = () => confetti.remove();
            }
        }

        async function performSpin() {
            if (isSpinning || balance < bet) return;
            AudioFX.init();

            isSpinning = true;
            spinButton.disabled = true;
            balance -= bet;
            
            displayScreen.classList.remove('screen-win-active');
            statusLabel.textContent = "SYS_PROCESS";
            winDisplay.textContent = "COMPUTING";
            winDisplay.style.color = "var(--neon-blue)";
            winDisplay.style.textShadow = "0 0 10px var(--neon-blue)";
            
            updateUI();

            const resultMatrix = generateResultMatrix();
            const durations = BASE_DURATIONS.map(d => d / currentSpeed);
            await Promise.all(reelStrips.map((strip, i) => spinReel(strip, durations[i], resultMatrix[i])));

            const wins = checkWins(resultMatrix);
            const totalWin = wins.reduce((sum, win) => sum + (bet * win.multiplier), 0);

            statusLabel.textContent = "WIN_INDEX";

            if (totalWin > 0) {
                balance += totalWin;
                highlightWinningSymbols(wins);
                AudioFX.win();

                winDisplay.textContent = `+${fmtMoney(totalWin)}`;
                winDisplay.style.color = "var(--neon-pink)";
                winDisplay.style.textShadow = "0 0 15px var(--neon-pink)";
                displayScreen.classList.add('screen-win-active');

                if (totalWin >= bet * 10) {
                    spawnConfetti();
                    if (navigator.vibrate) navigator.vibrate([150, 50, 150, 50, 300, 100, 400]); 
                } else if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100]); 
                }
            } else {
                winDisplay.textContent = "₴0";
                winDisplay.style.color = "#005577";
                winDisplay.style.textShadow = "none";
            }

            isSpinning = false;
            updateUI();

            // Фикс 4: Безопасный запуск следующего авто-спина
            if (autoMode) {
                if (balance >= 5) { // Проверяем, хватит ли денег хотя бы на минималку
                    autoSpinTimer = setTimeout(() => { 
                        if (autoMode && !isSpinning) performSpin(); 
                    }, 500 / currentSpeed);
                } else {
                    stopAutoMode();
                }
            }
        }

        function startAutoMode() {
            autoMode = true;
            autoButton.style.display = 'none';
            stopButton.style.display = 'block';
            performSpin();
        }

        function stopAutoMode() {
            autoMode = false;
            clearTimeout(autoSpinTimer); // Убиваем таймер принудительно
            autoButton.style.display = 'block';
            stopButton.style.display = 'none';
            updateUI();
        }

        // --- Управление ---
        speedToggle.addEventListener('click', () => {
            AudioFX.click();
            currentSpeedIndex = (currentSpeedIndex + 1) % speedLevels.length;
            currentSpeed = speedLevels[currentSpeedIndex].speed;
            updateSpeedButton();
        });

        spinButton.addEventListener('click', () => { AudioFX.click(); performSpin(); });
        
        autoButton.addEventListener('click', () => {
            AudioFX.click();
            if (!isSpinning && balance >= bet) startAutoMode();
        });

        stopButton.addEventListener('click', () => { AudioFX.click(); stopAutoMode(); });

        bonusButton.addEventListener('click', () => {
            AudioFX.bonus();
            balance = 1000; 
            winDisplay.textContent = "₴0";
            winDisplay.style.color = "#005577";
            winDisplay.style.textShadow = "none";
            updateUI();
        });

        document.getElementById('minusBet').addEventListener('click', () => {
            AudioFX.click();
            if (!isSpinning && bet - 5 >= 5) { bet -= 5; updateUI(); }
        });

        document.getElementById('plusBet').addEventListener('click', () => {
            AudioFX.click();
            if (!isSpinning && bet + 5 <= 5000 && bet + 5 <= balance) { bet += 5; updateUI(); }
        });

        document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

        document.addEventListener('keydown', (e) => {
            if (splashScreen.classList.contains('hidden') && e.code === 'Space' && !isSpinning && !autoMode && balance >= bet) {
                e.preventDefault();
                AudioFX.click();
                performSpin();
            }
        });

        // --- Запуск ---
        buildAllStrips();
        updateUI();
        updateSpeedButton();
    })();
</script>
</body>
</html>
