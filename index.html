<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ТАНКИ 90х</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            user-select: none; -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; /* разрешаем только манипуляции, но не масштабирование */
        }
        html, body {
            height: 100vh; width: 100vw; overflow: hidden;
            background: #0b0d10; font-family: 'Segoe UI', 'Courier New', monospace;
            touch-action: pan-x pan-y; /* разрешаем прокрутку? нет, у нас игра, лучше none, но на джойстике будет touch-action: none */
        }
        .game-wrapper {
            display: flex; flex-direction: column;
            height: 100vh; width: 100vw;
            background: radial-gradient(ellipse at 50% 30%, #1a2027 0%, #0b0d10 70%);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .game-container {
            flex: 1 1 auto; width: 100%;
            position: relative;
            background: #0a0c0f; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #4a4a4a;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8), inset 0 0 25px rgba(0,0,0,0.5);
            border-radius: 14px; margin: 8px 8px 0;
            aspect-ratio: 1 / 1;
            max-height: calc(100vh - 200px);
        }
        canvas {
            display: block; width: 100%; height: 100%;
            object-fit: contain; background: #0a0c0f;
            image-rendering: pixelated; image-rendering: crisp-edges;
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .controls {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 8px));
            background: linear-gradient(180deg, rgba(18,21,27,0.95) 0%, rgba(10,12,16,0.98) 100%);
            border-top: 2px solid #3a3a3a;
            min-height: 160px;
            gap: 10px;
            flex-shrink: 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .left-group {
            display: flex; align-items: center; gap: 12px;
            flex-shrink: 0;
        }
        .left-stack {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .center-info {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center;
            flex: 1 1 auto;
            min-width: 0;
            height: 100%;
        }

        .dpad-container {
            width: min(150px, 35vw); height: min(150px, 35vw);
            background: radial-gradient(circle at 40% 40%, #252d38, #10141c);
            border-radius: 20px;
            border: 2px solid #4a4a4a;
            box-shadow: 0 12px 25px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.08), inset 0 -3px 8px rgba(0,0,0,0.6);
            position: relative; display: flex; justify-content: center; align-items: center;
            flex-shrink: 0; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .dpad-container:active {
            border-color: #6b6b6b;
            box-shadow: 0 12px 25px rgba(0,0,0,0.7), inset 0 1px 3px rgba(255,255,255,0.15), inset 0 0 12px rgba(255,255,255,0.1);
        }
        .dpad-cross {
            width: 65%; height: 65%;
            background: linear-gradient(145deg, #2f3640, #1e232b);
            clip-path: polygon(33% 0, 66% 0, 66% 33%, 100% 33%, 100% 66%, 66% 66%, 66% 100%, 33% 100%, 33% 66%, 0 66%, 0 33%, 33% 33%);
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.8), inset 0 3px 5px rgba(255,255,255,0.1), 0 4px 8px rgba(0,0,0,0.5);
            border-radius: 5px; transition: box-shadow 0.2s; position: relative;
        }
        .dpad-container:active .dpad-cross {
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.8), inset 0 3px 5px rgba(255,255,255,0.15), inset 0 0 18px rgba(255,255,200,0.3), 0 2px 4px rgba(0,0,0,0.5);
        }
        .dpad-pip {
            width: 18px; height: 18px;
            background: radial-gradient(circle at 30% 30%, #5a626e, #1e242c);
            border-radius: 50%; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 3px 6px rgba(0,0,0,0.6);
        }

        .fullscreen-btn {
            width: 24px; height: 24px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #4a4a4a;
            color: #aaa;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .fullscreen-btn:active {
            border-color: #d4af37;
            color: #d4af37;
            background: #1a1a1a;
        }

        .pause-btn, .menu-btn {
            width: 70px; height: 68px; border-radius: 14px;
            background: linear-gradient(145deg, #1e242e, #10141c);
            border: 2px solid #4a4a4a; color: #c0c0c0; font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.15s ease;
            box-shadow: 0 5px 12px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,255,255,0.06);
            font-family: 'Courier New', monospace; flex-shrink: 0;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .center-buttons { display: flex; flex-direction: column; align-items: center; gap: 6px; }

        .info-item {
            color: #8a919c; font-size: 14px; font-weight: 600;
            font-family: 'Courier New', monospace;
            display: flex; align-items: center; gap: 6px;
            white-space: nowrap; letter-spacing: 1px;
        }
        .info-item span {
            color: #e0c88a; font-size: 20px; font-weight: 800;
            text-shadow: 0 0 8px rgba(224,200,138,0.3);
        }

        .fire-btn {
            width: 100%; height: auto; aspect-ratio: 1 / 1; max-height: 100%;
            margin: auto; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #2a3240, #10141c);
            border: 2px solid #4a4a4a;
            color: #ccb0b0; font-size: 0;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.1s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.08), inset 0 -3px 6px rgba(0,0,0,0.6), 0 0 15px rgba(255,200,100,0.15);
            flex-shrink: 0; position: relative; overflow: hidden;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .fire-btn .pulse {
            position: absolute; width: 26%; height: 26%;
            background: radial-gradient(circle, rgba(255,60,60,0.9) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: red-pulse 1s infinite alternate ease-in-out;
        }
        @keyframes red-pulse {
            from { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            to { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }
        .fire-btn .cross {
            position: absolute; display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }
        .fire-btn .cross::before, .fire-btn .cross::after {
            content: ""; position: absolute; background: #d0a090;
            border-radius: 3px; transition: background 0.15s;
            box-shadow: 0 0 6px rgba(255,200,150,0.5);
        }
        .fire-btn .cross::before { width: 40%; height: 4%; }
        .fire-btn .cross::after { width: 4%; height: 40%; }

        .bottom-info {
            display: flex; justify-content: space-between;
            align-items: center; padding: 4px 16px 8px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            gap: 10px;
        }
        .bottom-info .info-item { font-size: 12px; }
        .bottom-info .info-item span { font-size: 18px; }

        .menu-screen, .load-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 12px; padding: 20px; overflow-y: auto; box-sizing: border-box;
        }
        .menu-screen {
            background: rgba(6,8,12,0.94); gap: 15px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }
        .load-overlay { background: rgba(4,6,10,0.94); z-index: 55; }
        .load-dialog {
            background: linear-gradient(145deg, #1a2028, #0e1117);
            border: 2px solid #4a4a4a; border-radius: 20px;
            padding: 35px 25px; text-align: center; max-width: 340px; width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            color: #c0c0c0; margin: auto;
        }
        .menu-screen h1 {
            color: #e0c88a; font-size: clamp(26px, 5vw, 34px); letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(224,200,138,0.4), 0 3px 6px rgba(0,0,0,0.7); font-weight: 800; margin: 0;
        }
        .toggle-switch {
            display: flex; background: #10141a; border: 2px solid #4a4a4a;
            border-radius: 10px; overflow: hidden; width: 100%; max-width: 280px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.05);
        }
        .toggle-option {
            flex: 1; text-align: center; padding: 10px 0; font-size: clamp(11px, 3vw, 13px);
            color: #5e6874; background: transparent; cursor: pointer;
            font-family: 'Courier New', monospace; font-weight: 700;
            transition: all 0.2s; border-right: 2px solid #1e232a; letter-spacing: 1px;
            touch-action: manipulation;
        }
        .toggle-option:last-child { border-right: none; }
        .toggle-option.active[data-value="easy"] {
            background: #d4af37; color: #121212; font-weight: 800;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 0 10px rgba(212,175,55,0.3);
        }
        .toggle-option.active[data-value="normal"] {
            background: #f0a040; color: #121212; font-weight: 800;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 0 10px rgba(240,160,64,0.3);
        }
        .toggle-option.active[data-value="hard"] {
            background: #e04040; color: #121212; font-weight: 800;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 0 10px rgba(224,64,64,0.3);
        }
        .btn-start, .editor-btn, .reset-map-btn, .close-menu-btn {
            padding: 14px 30px; border-radius: 14px; border: 2px solid #4a4a4a;
            font-size: clamp(14px, 4vw, 16px); font-weight: 700; cursor: pointer;
            font-family: 'Courier New', monospace; transition: all 0.2s ease;
            box-shadow: 0 8px 18px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.06);
            margin-top: 8px; background: linear-gradient(145deg, #1e242e, #10141c);
            color: #c0c0c0; letter-spacing: 1px; width: 80%; max-width: 320px; text-align: center;
            position: relative; overflow: hidden;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .btn-start {
            background: linear-gradient(145deg, #e0c88a, #b09050);
            color: #111; border-color: #a08050;
            box-shadow: 0 8px 0 #7a6030, 0 10px 20px rgba(0,0,0,0.5);
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 4px 0 #7a6030, 0 6px 12px rgba(0,0,0,0.6); }
        .editor-btn:active, .reset-map-btn:active, .close-menu-btn:active {
            background: #252d36; border-color: #6b6b6b; color: #e0e0e0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.1);
        }
        @media (max-width: 500px) {
            .info-item { font-size: 11px; }
            .info-item span { font-size: 16px; }
            .pause-btn, .menu-btn { width: 60px; height: 58px; }
        }
        @media (max-height: 600px) {
            .menu-screen { padding: 10px; gap: 10px; }
            .btn-start, .editor-btn, .reset-map-btn, .close-menu-btn { padding: 10px 20px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper" id="gameWrapper">
    <div class="game-container">
        <canvas id="gameCanvas" width="780" height="780"></canvas>
        <div class="menu-screen" id="menuScreen">
            <h1>ТАНКИ 90х</h1>
            <p>ВЫБЕРИТЕ СЛОЖНОСТЬ</p>
            <div class="toggle-switch" id="difficultyToggle">
                <div class="toggle-option" data-value="easy">ЛЁГКИЙ</div>
                <div class="toggle-option active" data-value="normal">СРЕДНИЙ</div>
                <div class="toggle-option" data-value="hard">СЛОЖНЫЙ</div>
            </div>
            <button class="btn-start" id="btnStart">НАЧАТЬ ИГРУ</button>
            <button class="close-menu-btn" id="closeMenuBtn">ПРОДОЛЖИТЬ</button>
            <button class="editor-btn" id="editorBtn">🛠 РЕДАКТОР КАРТЫ</button>
            <button class="reset-map-btn" id="resetMapBtn">🔄 СБРОСИТЬ КАРТУ</button>
            <div style="text-align: right; width: 80%; max-width: 320px; margin: 5px auto 0; color: #8a919c; font-size: 12px;">by NeBro</div>
        </div>
        <div class="load-overlay" id="loadOverlay">
            <div class="load-dialog">
                <h2>ЗАГРУЗИТЬ СОХРАНЕНИЕ?</h2>
                <p>Обнаружен прогресс для этого уровня. Продолжить?</p>
                <div class="btn-group">
                    <button class="btn btn-yes" id="loadYes">ДА</button>
                    <button class="btn btn-no" id="loadNo">НЕТ</button>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="left-group">
            <div class="left-stack">
                <div class="dpad-container" id="joystick">
                    <div class="dpad-cross"><div class="dpad-pip"></div></div>
                </div>
                <button class="fullscreen-btn" id="fullscreenBtn" title="Полный экран">⛶</button>
            </div>
            <div class="center-buttons">
                <button class="pause-btn" id="pauseBtn">⏸</button>
                <button class="menu-btn" id="menuBtn">☰</button>
            </div>
        </div>
        <div class="center-info">
            <button class="fire-btn" id="fireBtn"><span class="pulse"></span><span class="cross"></span></button>
        </div>
    </div>
    <div class="bottom-info">
        <div class="info-item">РАУНД <span id="roundDisplay">1</span></div>
        <div class="info-item">ЖИЗНИ <span id="livesDisplay">3</span></div>
    </div>
</div>

<script>

    function initAudio() { if(!audioCtx) try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) {} }
    function playSound(t) {
        if(!audioCtx) return;
        const s = {
            fire:{type:'square',freq:[800,200],dur:0.1,vol:0.3},
            explode:{type:'sawtooth',freq:[150,50],dur:0.3,vol:0.4},
            damage:{type:'sine',freq:[300,100],dur:0.2,vol:0.5},
            win:{type:'square',freq:[523,659,784],dur:0.5,vol:0.3},
            gameover:{type:'sawtooth',freq:[200,80],dur:0.8,vol:0.4},
            bonus:{type:'sine',freq:[880,660],dur:0.2,vol:0.2}
        }[t]; if(!s) return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        const n = audioCtx.currentTime;
        o.type = s.type; o.frequency.setValueAtTime(s.freq[0], n);
        if(s.freq.length>1) o.frequency.exponentialRampToValueAtTime(s.freq[1], n+s.dur);
        g.gain.setValueAtTime(s.vol, n); g.gain.exponentialRampToValueAtTime(0.01, n+s.dur);
        o.start(n); o.stop(n+s.dur);
    }

    function spawnExplosion(x,y,c,clr) {
        for(let i=0;i<c;i++) {
            const a = Math.random()*2*Math.PI, sp = 1+Math.random()*4;
            const cols = clr?[clr]:['#ff6600','#ffaa00','#ff4400','#ffcc44','#ff0000'];
            particles.push({
                x:x+(Math.random()-0.5)*10, y:y+(Math.random()-0.5)*10,
                vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                life:0.8+Math.random()*0.6, decay:0.008+Math.random()*0.015,
                size:2+Math.random()*4,
                color:cols[Math.floor(Math.random()*cols.length)]
            });
        }
    }
    function updateParticles() {
        for(let i=particles.length-1;i>=0;i--) {
            const p = particles[i];
            p.x+=p.vx; p.y+=p.vy; p.vx*=0.98; p.vy*=0.98;
            p.life-=p.decay; p.size*=0.99;
            if(p.life<=0||p.size<0.5) particles.splice(i,1);
        }
    }
    function updateBonuses() {
        for(let i=bonuses.length-1;i>=0;i--) {
            const b = bonuses[i]; b.y+=b.vy; b.bob+=0.1;
            if(b.y>canvas.height) { bonuses.splice(i,1); continue; }
            if(player.alive && b.x+b.w>player.x && b.x<player.x+player.w && b.y+b.h>player.y && b.y<player.y+player.h) {
                switch(b.type) {
                    case 'speed': playerBonuses.speed=300; break;
                    case 'shield': playerBonuses.shield=1; break;
                    case 'power': playerBonuses.power=300; break;
                    case 'life': lives = Math.min(lives+1, 5); break;
                }
                playSound('bonus'); bonuses.splice(i,1);
            }
        }
    }

    function generateRandomMap() {
        const template = MAP_TEMPLATES[Math.floor(Math.random() * MAP_TEMPLATES.length)];
        let grid = template.map(row => [...row]);
        grid[12][6] = 3; grid[12][1] = 4;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if ((r === 12 && c === 6) || (r === 12 && c === 1)) continue;
                if (r === 0 && (c === 1 || c === 6 || c === 11)) continue;
                if ((r === 11 && (c === 1 || c === 6)) || (r === 12 && (c === 0 || c === 2 || c === 5 || c === 7 || c === 12))) continue;
                if (Math.random() < 0.08) {
                    const v = grid[r][c];
                    if (v === 0) grid[r][c] = 1;
                    else if (v === 1) grid[r][c] = Math.random() < 0.3 ? 2 : 0;
                    else if (v === 2) grid[r][c] = 0;
                }
            }
        }
        grid[11][5] = 2; grid[11][6] = 2; grid[11][7] = 2;
        grid[10][5] = 2; grid[10][7] = 2;
        grid[12][5] = 0; grid[12][7] = 0;
        grid[11][1] = 0; grid[11][6] = 0;
        if (grid[11][0] !== 0) grid[11][0] = 0;
        if (grid[11][2] !== 0) grid[11][2] = 0;
        return grid;
    }

    function isValidGrid(grid) {
        if (!Array.isArray(grid) || grid.length !== ROWS) return false;
        for (let row of grid) {
            if (!Array.isArray(row) || row.length !== COLS) return false;
            for (let cell of row) if (typeof cell !== 'number' || cell < 0 || cell > 4) return false;
        }
        return true;
    }

    function buildWallsFromGrid(grid) {
        walls = []; nets = []; base = {x:6*TILE,y:12*TILE,w:TILE,h:TILE,alive:true};
        for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
            const v = grid[r][c];
            if(v===1) walls.push({x:c*TILE,y:r*TILE,w:TILE,h:TILE,type:'brick'});
            else if(v===2) walls.push({x:c*TILE,y:r*TILE,w:TILE,h:TILE,type:'steel'});
        }
        for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
            if(grid[r][c]===0 && !(r===0&&(c===1||c===6||c===11)) && !(r===12&&(c===1||c===6||c===7)) && Math.random()<0.25)
                nets.push({x:c*TILE,y:r*TILE,w:TILE,h:TILE});
        }
    }

    function loadLevel() {
        let grid;
        if (editMode && editGrid) grid = editGrid;
        else {
            const saved = localStorage.getItem('custom_map');
            if (saved) {
                try {
                    grid = JSON.parse(saved);
                    if (!isValidGrid(grid)) throw new Error('Invalid grid');
                } catch (e) {
                    localStorage.removeItem('custom_map');
                    grid = generateRandomMap();
                }
            } else grid = generateRandomMap();
        }
        buildWallsFromGrid(grid);
        player.x = 1*TILE; player.y = 12*TILE; player.dir = 0;
    }

    function resetMap() { localStorage.removeItem('custom_map'); loadLevel(); updateInfo(); }

    function getSaveKey(d) { return 'tanks_save_'+d; }
    function saveGame() {
        if(gameOver) return;
        const data = { difficulty, score, lives, currentRound, enemiesSpawnedInRound, enemiesKilledInRound, enemiesPerRound, playerBonuses, player:{x:player.x,y:player.y,dir:player.dir,alive:player.alive} };
        try { localStorage.setItem(getSaveKey(difficulty), JSON.stringify(data)); } catch(e) {}
    }
    function loadGame(d) { try { const r = localStorage.getItem(getSaveKey(d)); return r?JSON.parse(r):null; } catch(e) { return null; } }
    function clearSave(d) { try { localStorage.removeItem(getSaveKey(d)); } catch(e) {} }

    function startNewRound() {
        loadLevel(); player.alive=true; player.cooldown=0; player.respawnTimer=0;
        enemies=[]; bullets=[]; particles=[]; bonuses=[];
        enemiesAlive=0; enemiesSpawnedInRound=0; enemiesKilledInRound=0;
        roundComplete=false; spawnTimer=0;
        enemiesPerRound = Math.min(30, settings.enemiesBase + (currentRound-1)*2);
        spawnDelay = Math.max(20, settings.spawnDelay - currentRound*2);
        if(currentRound>1) { lives = Math.min(lives+1, 5); playSound('win'); }

    function initGame(diff, loadFromSave) {
        difficulty = diff || difficulty;
        settings = DIFFICULTY[difficulty];
        MAX_ENEMIES = settings.maxEnemies; spawnDelay = settings.spawnDelay;
        gameOver=false; win=false; particles=[]; bonuses=[]; playerBonuses={speed:0,shield:0,power:0}; paused=false;
        if(loadFromSave) {
            const saved = loadGame(difficulty);
            if(saved) {
                score=saved.score; lives=saved.lives; currentRound=saved.currentRound;
                enemiesSpawnedInRound=saved.enemiesSpawnedInRound; enemiesKilledInRound=saved.enemiesKilledInRound;
                enemiesPerRound=saved.enemiesPerRound; playerBonuses=saved.playerBonuses;
                player.x=saved.player?.alive?saved.player.x:1*TILE; player.y=saved.player?.alive?saved.player.y:12*TILE;
                player.dir=saved.player?.dir||0; player.alive=saved.player?.alive||true;
                player.cooldown=0; player.respawnTimer=0;
                loadLevel(); enemies=[]; bullets=[]; enemiesAlive=0; roundComplete=false; spawnTimer=0;
                spawnDelay = Math.max(20, settings.spawnDelay - currentRound*2);
                updateInfo(); gameStarted=true; return;
            }
        }
        lives=settings.lives; score=0; currentRound=1;
        player.x=1*TILE; player.y=12*TILE; player.dir=0; player.alive=true; player.cooldown=0; player.respawnTimer=0;
        loadLevel(); enemies=[]; bullets=[]; enemiesAlive=0; enemiesSpawnedInRound=0; enemiesKilledInRound=0;
        roundComplete=false; spawnTimer=0;
        enemiesPerRound = Math.min(30, settings.enemiesBase + (currentRound-1)*2);
        spawnDelay = Math.max(20, settings.spawnDelay - currentRound*2);
        updateInfo(); clearSave(difficulty);

    function collidesWithWalls(x,y,w,h) { for(let wl of walls) if(x<wl.x+wl.w&&x+w>wl.x&&y<wl.y+wl.h&&y+h>wl.y) return true; return false; }
    function collidesWithBase(x,y,w,h) { if(!base||!base.alive) return false; return (x<base.x+base.w&&x+w>base.x&&y<base.y+base.h&&y+h>base.y); }
    function collidesWithEnemies(x,y,w,h,ex) { for(let e of enemies) if(e!==ex&&e.alive&&x<e.x+e.w&&x+w>e.x&&y<e.y+e.h&&y+h>e.y) return true; return false; }
    function collidesWithPlayer(x,y,w,h) { if(!player.alive) return false; return (x<player.x+player.w&&x+w>player.x&&y<player.y+player.h&&y+h>player.y); }

    function spawnEnemy() {
        if(enemiesAlive>=MAX_ENEMIES||gameOver||win||enemiesSpawnedInRound>=enemiesPerRound) return false;
        const sps = [{x:1*TILE,y:1*TILE},{x:6*TILE,y:1*TILE},{x:11*TILE,y:1*TILE}];
        let pos=null;
        for(let sp of sps) {
            if(!collidesWithWalls(sp.x,sp.y,TILE-2,TILE-2)&&!collidesWithBase(sp.x,sp.y,TILE-2,TILE-2)&&!collidesWithEnemies(sp.x,sp.y,TILE-2,TILE-2,null)&&!collidesWithPlayer(sp.x,sp.y,TILE-2,TILE-2)) {
                pos=sp; break;
            }
        }
        if(!pos) return false;
        let type='normal', hp=1, spMult=1;
        const rnd=Math.random();
        const cSh=Math.min(0.4,settings.shootCh+currentRound*0.01), cAr=Math.min(0.5,settings.armorCh+currentRound*0.01), cFa=Math.min(0.6,settings.fastCh+currentRound*0.01);
        if(currentRound>2&&rnd<cSh) type='shooter';
        else if(currentRound>3&&rnd<cSh+cAr) { type='armored'; hp=2+(currentRound>10?1:0); }
        else if(currentRound>1&&rnd<cSh+cAr+cFa) { type='fast'; spMult=1.8; }
        const speed = Math.min(5.0, (ENEMY_BASE_SPEED*settings.speedMult+Math.random()*0.4+currentRound*0.05)*spMult);
        const enemy = { x:pos.x, y:pos.y, w:TILE-2, h:TILE-2, dir:2, speed, alive:true, cooldown:0, moveDir:2, changeDirTimer:0, hp, type };
        enemies.push(enemy); enemiesAlive++; enemiesSpawnedInRound++;
        spawnExplosion(pos.x+TILE/2,pos.y+TILE/2,25,'#FFFFFF');
        return true;
    }

    function fireBullet(x, y, dir, owner, power) {
        const size = power ? 20 : 14;
        const sp = power ? BULLET_SPEED * 1.5 : BULLET_SPEED;
        const w = TILE - 2, h = TILE - 2;
        let bx, by, dx = 0, dy = 0;
        switch(dir) {
            case 0: bx = x + w/2 - size/2; by = y - size; dy = -sp; break;
            case 1: bx = x + w; by = y + h/2 - size/2; dx = sp; break;
            case 2: bx = x + w/2 - size/2; by = y + h; dy = sp; break;
            case 3: bx = x - size; by = y + h/2 - size/2; dx = -sp; break;
        }
        bullets.push({x: bx, y: by, w: size, h: size, dx, dy, dir, owner, power: power || false});
        playSound('fire');
    }

    function update() {
        if(gameOver || win) return;
        if(editMode) { handleEditInput(); return; }
        if(paused) return;

        if(playerBonuses.speed>0) playerBonuses.speed--;
        if(playerBonuses.power>0) playerBonuses.power--;

        if(player.alive) {
            let mx=0, my=0;
            if(joystickActive) {
                const len = Math.hypot(joystickDir.x,joystickDir.y);
                if(len>0.2) {
                    const ang = Math.atan2(joystickDir.y/len,joystickDir.x/len)*180/Math.PI;
                    if(ang>-45&&ang<=45){mx=1;player.dir=1;}
                    else if(ang>45&&ang<=135){my=1;player.dir=2;}
                    else if(ang>-135&&ang<=-45){my=-1;player.dir=0;}
                    else {mx=-1;player.dir=3;}
                }
            }
            const sp = PLAYER_SPEED + (playerBonuses.speed>0?2:0);
            let nx = player.x + mx*sp;
            nx = Math.max(0, Math.min(canvas.width - player.w, nx));
            if(!collidesWithWalls(nx,player.y,player.w,player.h)&&!collidesWithBase(nx,player.y,player.w,player.h)&&!collidesWithEnemies(nx,player.y,player.w,player.h,null)) player.x=nx;
            let ny = player.y + my*sp;
            ny = Math.max(0, Math.min(canvas.height - player.h, ny));
            if(!collidesWithWalls(player.x,ny,player.w,player.h)&&!collidesWithBase(player.x,ny,player.w,player.h)&&!collidesWithEnemies(player.x,ny,player.w,player.h,null)) player.y=ny;

            if(player.cooldown>0) player.cooldown--;
            if(firePressed&&player.cooldown===0&&player.alive) {
                fireBullet(player.x,player.y,player.dir,'player',playerBonuses.power>0);
                player.cooldown = playerBonuses.power>0?6:12;
            }
        } else {
            player.respawnTimer--;
            if(player.respawnTimer<=0&&lives>0) {
                player.alive=true; player.x=1*TILE; player.y=12*TILE; player.dir=0;
                spawnExplosion(player.x+TILE/2,player.y+TILE/2,30);
            }
        }

        for(let i=enemies.length-1;i>=0;i--) {
            const e = enemies[i];
            if(!e.alive) { enemies.splice(i,1); continue; }
            e.changeDirTimer--;
            if(player.alive&&Math.random()<settings.chase*0.1) {
                const dx=player.x-e.x, dy=player.y-e.y;
                e.moveDir = Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);
                e.changeDirTimer=15+Math.random()*20;
            }
            if(e.changeDirTimer<=0) {
                e.moveDir = Math.floor(Math.random()*4);
                e.changeDirTimer = 40+Math.floor(Math.random()*60);
            }
            let mx=0,my=0;
            switch(e.moveDir){case 0:my=-e.speed;break;case 1:mx=e.speed;break;case 2:my=e.speed;break;case 3:mx=-e.speed;break;}
            let enx = e.x + mx;
            enx = Math.max(0, Math.min(canvas.width - e.w, enx));
            if(!collidesWithWalls(enx,e.y,e.w,e.h)&&!collidesWithBase(enx,e.y,e.w,e.h)&&!collidesWithEnemies(enx,e.y,e.w,e.h,e)&&!collidesWithPlayer(enx,e.y,e.w,e.h)) e.x=enx;
            let eny = e.y + my;
            eny = Math.max(0, Math.min(canvas.height - e.h, eny));
            if(!collidesWithWalls(e.x,eny,e.w,e.h)&&!collidesWithBase(e.x,eny,e.w,e.h)&&!collidesWithEnemies(e.x,eny,e.w,e.h,e)&&!collidesWithPlayer(e.x,eny,e.w,e.h)) e.y=eny;
            if(mx||my) e.dir = e.moveDir;

            if(e.cooldown>0) e.cooldown--;
            const fc=(0.02+currentRound*0.003)*settings.fireMult;
            if(e.cooldown===0&&e.alive&&Math.random()<fc*(e.type==='shooter'?2.5:1)) {
                fireBullet(e.x,e.y,e.dir,'enemy');
                e.cooldown=Math.floor((45+Math.random()*25)*(e.type==='shooter'?0.4:1));
            }
        }

        if(!roundComplete&&!gameOver) {
            spawnTimer--;
            if(spawnTimer<=0&&enemiesAlive<MAX_ENEMIES&&enemiesSpawnedInRound<enemiesPerRound) {
                spawnTimer = spawnEnemy()?Math.max(15,spawnDelay-Math.min(currentRound*2,40)):15;
            }
        }

        for(let i=bullets.length-1;i>=0;i--) {
            const b=bullets[i]; b.x+=b.dx; b.y+=b.dy;
            let remove = b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height;
            if(!remove) {
                for(let j=walls.length-1;j>=0;j--) {
                    const w=walls[j];
                    if(b.x<w.x+w.w&&b.x+b.w>w.x&&b.y<w.y+w.h&&b.y+b.h>w.y) {
                        if(w.type==='brick') { walls.splice(j,1); spawnExplosion(w.x+TILE/2,w.y+TILE/2,20); }
                        remove=true; break;
                    }
                }
            }
            if(!remove&&base&&base.alive&&b.x<base.x+base.w&&b.x+b.w>base.x&&b.y<base.y+base.h&&b.y+b.h>base.y) {
                if(Math.random()<0.25) { base.alive=false; gameOver=true; playSound('gameover'); clearSave(difficulty); }
                else spawnExplosion(base.x+TILE/2,base.y+TILE/2,20);
                remove=true;
            }
            if(!remove&&b.owner==='enemy'&&player.alive&&b.x<player.x+player.w&&b.x+b.w>player.x&&b.y<player.y+player.h&&b.y+b.h>player.y) {
                if(playerBonuses.shield>0) { playerBonuses.shield=0; spawnExplosion(player.x+TILE/2,player.y+TILE/2,20,'#00aaff'); }
                else { player.alive=false; lives--; player.respawnTimer=90; playSound('damage'); spawnExplosion(player.x+TILE/2,player.y+TILE/2,40); if(lives<=0) { gameOver=true; playSound('gameover'); clearSave(difficulty); } }
                remove=true;
            }
            if(!remove&&b.owner==='player') {
                for(let j=enemies.length-1;j>=0;j--) {
                    const e = enemies[j];
                    if(!e.alive) continue;
                    if(b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y) {
                        e.hp--;
                        if(e.hp<=0) {
                            e.alive=false; enemiesAlive--; enemiesKilledInRound++;
                            score+=Math.floor(10*settings.scoreMult)+currentRound*2;
                            spawnExplosion(e.x+TILE/2,e.y+TILE/2,35);
                            if(Math.random()<0.25) bonuses.push({x:e.x+TILE/2,y:e.y+TILE/2,type:['speed','shield','power','life'][Math.floor(Math.random()*4)],w:20,h:20,vy:-1,bob:0});
                        }
                        remove=true; break;
                    }
                }
            }
            if(remove) bullets.splice(i,1);
        }

        if(!roundComplete&&!gameOver&&enemiesAlive===0&&enemiesSpawnedInRound>=enemiesPerRound) {
            roundComplete=true; playSound('win');
            setTimeout(()=>{if(!gameOver&&!win){currentRound++;startNewRound();}},1500);
        }

        updateParticles(); updateBonuses(); updateInfo();
    }

    function updateInfo() { livesSpan.textContent=lives; roundSpan.textContent=currentRound; }

    function drawPixelTank(x,y,dir,isPlayer) {
        const s=4, off=(TILE-14*s)/2, cx=x+TILE/2, cy=y+TILE/2;
        ctx.save();
        ctx.translate(cx,cy); ctx.rotate(dir*Math.PI/2); ctx.translate(-TILE/2+off,-TILE/2+off);
        if(isPlayer) {
            ctx.fillStyle='#9B8244'; ctx.fillRect(0*s,0*s,2*s,14*s); ctx.fillRect(12*s,0*s,2*s,14*s);
            ctx.fillStyle='#F8A163'; for(let r=0;r<14;r+=3){ctx.fillRect(0*s,r*s,2*s,1*s);ctx.fillRect(12*s,r*s,2*s,1*s);}
            ctx.fillStyle='#FFF29D'; ctx.fillRect(2*s,2*s,10*s,10*s); ctx.fillRect(2*s,12*s,10*s,2*s);
            ctx.fillStyle='#FFB078'; ctx.fillRect(3*s,3*s,8*s,6*s); ctx.fillRect(4*s,2*s,6*s,2*s); ctx.fillRect(2*s,9*s,10*s,2*s);
            ctx.fillStyle='#FFF29D'; ctx.fillRect(5*s,4*s,4*s,2*s); ctx.fillRect(4*s,6*s,2*s,2*s); ctx.fillRect(8*s,6*s,2*s,2*s); ctx.fillRect(6*s,0*s,2*s,4*s);
        } else {
            ctx.fillStyle='#5A5A5A'; ctx.fillRect(0*s,0*s,2*s,14*s); ctx.fillRect(12*s,0*s,2*s,14*s);
            ctx.fillStyle='#8A8A8A'; for(let r=0;r<14;r+=3){ctx.fillRect(0*s,r*s,2*s,1*s);ctx.fillRect(12*s,r*s,2*s,1*s);}
            ctx.fillStyle='#C0C0C0'; ctx.fillRect(2*s,2*s,10*s,10*s);
            ctx.fillStyle='#A52A2A'; ctx.fillRect(3*s,3*s,8*s,6*s);
            ctx.fillStyle='#C0C0C0'; ctx.fillRect(4*s,2*s,6*s,2*s);
            ctx.fillStyle='#A52A2A'; ctx.fillRect(2*s,9*s,10*s,2*s);
            ctx.fillStyle='#C0C0C0'; ctx.fillRect(5*s,4*s,4*s,2*s); ctx.fillRect(4*s,6*s,2*s,2*s); ctx.fillRect(8*s,6*s,2*s,2*s);
            ctx.fillStyle='#A52A2A'; ctx.fillRect(6*s,0*s,2*s,4*s);
        }
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#0a0c0f'; ctx.fillRect(0,0,canvas.width,canvas.height);

        for(let w of walls) {
            ctx.drawImage(w.type==='brick'?brickCanvas:steelCanvas, w.x, w.y);
        }

        if(base&&base.alive) {
            ctx.fillStyle='#c0c0c0';
            ctx.fillRect(base.x+4,base.y+4,base.w-8,base.h-8);
            ctx.strokeStyle='#808080'; ctx.lineWidth=2;
            ctx.strokeRect(base.x+4,base.y+4,base.w-8,base.h-8);
            ctx.fillStyle='#4a3a2a'; ctx.font='bold 36px "Courier New"';
            ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText('★',base.x+base.w/2,base.y+base.h/2);
        }

        for(let e of enemies) if(e.alive) drawPixelTank(e.x,e.y,e.dir,false);
        if(player.alive) {
            drawPixelTank(player.x,player.y,player.dir,true);
            if(playerBonuses.shield>0) {
                ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1;
                ctx.setLineDash([4,4]); ctx.strokeRect(player.x-2,player.y-2,player.w+4,player.h+4); ctx.setLineDash([]);
            }
        }

        for(let n of nets) {
            for(let r=0;r<TILE;r+=6) for(let c=0;c<TILE;c+=6) {
                ctx.fillStyle=(Math.floor(r/6)+Math.floor(c/6))%2===0?'#2d5a1e':'#4c7a3c';
                ctx.fillRect(n.x+c,n.y+r,6,6);
            }
        }

        ctx.save();
        ctx.shadowColor='rgba(255,255,255,0.7)'; ctx.shadowBlur=8;
        for(let b of bullets) {
            ctx.fillStyle='#FFF'; ctx.fillRect(b.x+1,b.y+1,b.w-2,b.h-2);
            ctx.fillStyle='#c0c0c0'; ctx.fillRect(b.x+2,b.y+2,b.w-4,b.h-4);
        }
        ctx.restore();

        for(let b of bonuses) {
            const bob=Math.sin(b.bob)*3;
            ctx.font='22px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
            let icon = b.type==='speed'?'⚡':b.type==='shield'?'🛡️':b.type==='power'?'💥':'❤️';
            ctx.fillText(icon,b.x+b.w/2,b.y+b.h/2+bob);
        }

        ctx.save();
        ctx.globalCompositeOperation='lighter';
        for(let p of particles) {
            ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
            ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
        }
        ctx.restore();

        if(paused && !editMode && !gameOver) {
            ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='#fff'; ctx.font='bold 42px "Courier New"'; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText('ПАУЗА', canvas.width/2, canvas.height/2);
        }
        if(gameOver) {
            ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='#c0c0c0'; ctx.font='bold 50px "Courier New"'; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-20);
        }
    }

    function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

    function showMenu() { menuScreen.style.display='flex'; loadOverlay.style.display='none'; }
    function hideMenu() { menuScreen.style.display='none'; }

    function startEditor() {
        paused = true; gameOver = false; win = false; editMode = true;
        enemies = []; bullets = []; particles = []; bonuses = [];
        originalWallsBackup = walls.map(w => ({...w}));
        const saved = localStorage.getItem('custom_map');
        editGrid = saved ? (()=>{ try { const g = JSON.parse(saved); return isValidGrid(g) ? g : generateRandomMap(); } catch(e) { return generateRandomMap(); } })() : generateRandomMap();
        editGrid[12][6]=3; editGrid[12][1]=4;
        buildWallsFromGrid(editGrid);
        editCursor = {col:0, row:0}; editMoveCooldown = 0;
    }
    function saveEditorMap() {
        let grid = Array.from({length:ROWS},()=>Array(COLS).fill(0));
        for(let w of walls) {
            const c = w.x/TILE, r = w.y/TILE;
            if(r===12&&c===6) continue;
            if(r===12&&c===1) continue;
            grid[r][c] = w.type==='brick'?1:2;
        }
        grid[12][6]=3; grid[12][1]=4;
        localStorage.setItem('custom_map', JSON.stringify(grid));
        editMode = false; paused = false;
        loadLevel();
    }
    function cancelEditor() {
        if (originalWallsBackup) {
            walls = originalWallsBackup;
            originalWallsBackup = null;
        }
        editMode = false; paused = false;
    }

    let lastFireEdit = false;
    function handleEditInput() {
        if (!editMode) return;
        if (editMoveCooldown > 0) editMoveCooldown--;
        if (joystickActive && editMoveCooldown <= 0) {
            const len = Math.hypot(joystickDir.x, joystickDir.y);
            if (len > 0.5) {
                const ang = Math.atan2(joystickDir.y, joystickDir.x) * 180 / Math.PI;
                if (ang > -45 && ang <= 45) editCursor.col = Math.min(COLS-1, editCursor.col+1);
                else if (ang > 45 && ang <= 135) editCursor.row = Math.min(ROWS-1, editCursor.row+1);
                else if (ang > -135 && ang <= -45) editCursor.row = Math.max(0, editCursor.row-1);
                else editCursor.col = Math.max(0, editCursor.col-1);
                if ((editCursor.row===12&&editCursor.col===1) || (editCursor.row===12&&editCursor.col===6)) {
                    editCursor.col = 0; editCursor.row = 0;
                }
                editMoveCooldown = 10;
            }
        }
        if (firePressed && !lastFireEdit) {
            const r = editCursor.row, c = editCursor.col;
            if (!((r===12&&c===1) || (r===12&&c===6))) {
                const w = walls.find(w=>w.x===c*TILE&&w.y===r*TILE);
                if (w) walls = walls.filter(w=>!(w.x===c*TILE&&w.y===r*TILE));
                else walls.push({x:c*TILE, y:r*TILE, w:TILE, h:TILE, type:'brick'});
            }
            lastFireEdit = true;
        }
        if (!firePressed) lastFireEdit = false;
    }

    // Полноэкранный режим
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
        if (document.fullscreenEnabled) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else if (canvas.requestFullscreen) {
            canvas.requestFullscreen().catch(() => {});
        }
    });

    // Обработчики управления
    pauseBtn.addEventListener('click', ()=>{
        initAudio();
        if(editMode) saveEditorMap();
        else { paused = !paused; pauseBtn.textContent = paused ? '▶' : '⏸'; }
    });
    document.getElementById('menuBtn').addEventListener('click', ()=>{
        initAudio();
        if(editMode) cancelEditor();
        else { paused = true; pauseBtn.textContent = '▶'; showMenu(); }
    });
    document.getElementById('editorBtn').addEventListener('click', ()=>{ initAudio(); hideMenu(); startEditor(); });
    document.getElementById('resetMapBtn').addEventListener('click', ()=>{ initAudio(); resetMap(); hideMenu(); startGameWithDifficulty(difficulty, false); });
    document.getElementById('closeMenuBtn').addEventListener('click', ()=>{
        initAudio(); hideMenu();
        if (gameStarted) { paused = false; pauseBtn.textContent = '⏸'; }
    });
    document.getElementById('btnStart').addEventListener('click', ()=>{
        initAudio(); const saved = loadGame(difficulty);
        if(saved) { loadOverlay.style.display='flex'; pendingDiff=difficulty; }
        else startGameWithDifficulty(difficulty, false);
    });
    let pendingDiff = null;
    function startGameWithDifficulty(diff, loadFromSave) {
        initGame(diff, loadFromSave); hideMenu(); gameOver=false; win=false; updateInfo();
        gameStarted = true;
    }
    document.getElementById('loadYes').addEventListener('click', ()=>{ loadOverlay.style.display='none'; if(pendingDiff) startGameWithDifficulty(pendingDiff, true); });
    document.getElementById('loadNo').addEventListener('click', ()=>{ loadOverlay.style.display='none'; if(pendingDiff) { clearSave(pendingDiff); startGameWithDifficulty(pendingDiff, false); } });

    // Джойстик и кнопка огня с pointer events
    const joystickEl = document.getElementById('joystick');
    const fireBtn = document.getElementById('fireBtn');
    let firePointerId = null;
    function updateJoystickPos() { const r = joystickEl.getBoundingClientRect(); jcx = r.left + r.width/2; jcy = r.top + r.height/2; }
    function handleJoystick(cx, cy) {
        updateJoystickPos(); let dx = cx - jcx, dy = cy - jcy;
        if(Math.hypot(dx,dy) < 8) { joystickActive = false; joystickDir = {x:0, y:0}; return; }
        joystickActive = true; const n = Math.max(Math.abs(dx), Math.abs(dy), 1); joystickDir = { x: dx/n, y: dy/n };
    }
    function resetJoystick() { joystickActive = false; joystickDir = { x:0, y:0 }; }

    joystickEl.addEventListener('pointerdown', e => {
        e.preventDefault(); joystickEl.setPointerCapture(e.pointerId);
        handleJoystick(e.clientX, e.clientY);
    });
    joystickEl.addEventListener('pointermove', e => {
        if(!joystickEl.hasPointerCapture(e.pointerId)) return;
        handleJoystick(e.clientX, e.clientY);
    });
    joystickEl.addEventListener('pointerup', e => { resetJoystick(); joystickEl.releasePointerCapture(e.pointerId); });
    joystickEl.addEventListener('pointercancel', e => { resetJoystick(); joystickEl.releasePointerCapture(e.pointerId); });

    fireBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        fireBtn.setPointerCapture(e.pointerId);
        firePointerId = e.pointerId;
        firePressed = true;
        initAudio();
    });
    fireBtn.addEventListener('pointerup', e => {
        if (firePointerId !== null) {
            fireBtn.releasePointerCapture(firePointerId);
            firePointerId = null;
        }
        firePressed = false;
    });
    fireBtn.addEventListener('pointercancel', e => {
        if (firePointerId !== null) {
            fireBtn.releasePointerCapture(firePointerId);
            firePointerId = null;
        }
        firePressed = false;
    });

    canvas.addEventListener('pointerdown', () => { if(gameOver) { showMenu(); gameOver = false; } });

    document.addEventListener('touchmove', e => { if(e.target.closest('.game-wrapper')) e.preventDefault(); }, {passive: false});

    document.querySelectorAll('.toggle-option').forEach(opt => opt.addEventListener('click', function(){
        document.querySelectorAll('.toggle-option').forEach(o => o.classList.remove('active'));
        this.classList.add('active');
        difficulty = this.dataset.value;
    }));

    showMenu();
    initGame('normal', false);
    gameLoop();
})();
</script>
</body>
