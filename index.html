<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Танчики 90х DX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        html, body { height: 100vh; width: 100vw; overflow: hidden; background: #05050f; font-family: 'Courier New', monospace; touch-action: none; }
        .game-wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; background: #05050f; touch-action: none; position: relative; }
        .game-container { flex: 1; position: relative; background: #0a0a12; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #05050f; image-rendering: pixelated; touch-action: none; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 16px 16px; touch-action: none; gap: 12px; background: rgba(5, 5, 15, 0.9); border-top: 1px solid rgba(0, 180, 255, 0.2); flex-shrink: 0; backdrop-filter: blur(10px); }
        .joystick-area { flex: 1; display: flex; justify-content: center; }
        .joystick { width: 130px; height: 130px; background: radial-gradient(circle, #151525, #08081a); border-radius: 50%; position: relative; border: 3px solid rgba(100, 150, 255, 0.6); box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 100, 255, 0.2); }
        .joystick-knob { width: 52px; height: 52px; background: radial-gradient(circle, #6a9aff, #1a3a8a); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid #80b0ff; box-shadow: 0 0 30px rgba(80, 180, 255, 0.7); pointer-events: none; }
        .fire-area { flex: 1; display: flex; justify-content: center; align-items: center; }
        .fire-btn { width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, #ff4444, #8a0000); border: 4px solid #ff6666; color: #fff; font-size: 30px; font-weight: bold; text-shadow: 0 0 20px rgba(255,0,0,0.8); box-shadow: 0 0 40px rgba(255,50,50,0.3), inset 0 -6px 0 #500; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; transition: transform 0.05s, box-shadow 0.05s; }
        .fire-btn:active { transform: scale(0.88); box-shadow: 0 0 80px rgba(255,50,50,0.8); }
        
        /* HUD */
        .info { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; color: #aaf; font-size: 16px; font-weight: bold; background: rgba(5, 5, 15, 0.9); border-bottom: 1px solid rgba(0, 180, 255, 0.15); flex-shrink: 0; backdrop-filter: blur(10px); }
        .info-item { display: flex; align-items: center; gap: 6px; text-shadow: 0 0 10px rgba(100, 200, 255, 0.2); }
        .info-item span { color: #ffd700; font-size: 18px; }
        .info-item .round { color: #00ff88; margin-left: 4px; }
        .bonus-indicator { display: flex; gap: 4px; margin-left: 8px; font-size: 20px; }
        
        /* Кнопки */
        .fullscreen-btn, .close-btn {
            position: absolute; top: 12px; width: 44px; height: 44px; border-radius: 50%;
            background: rgba(20, 30, 50, 0.7); border: 2px solid rgba(0, 180, 255, 0.5);
            color: #00d4ff; font-size: 24px; display: flex; align-items: center; justify-content: center;
            z-index: 30; cursor: pointer; touch-action: none; backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 180, 255, 0.3);
            transition: all 0.2s ease;
        }
        .fullscreen-btn:active, .close-btn:active { transform: scale(0.85); background: rgba(0, 180, 255, 0.2); box-shadow: 0 0 30px rgba(0, 180, 255, 0.6); }
        .fullscreen-btn { left: 12px; }
        .close-btn { right: 12px; }
        
        @media (max-width: 500px) {
            .joystick { width: 100px; height: 100px; }
            .joystick-knob { width: 40px; height: 40px; }
            .fire-btn { width: 85px; height: 85px; font-size: 26px; }
            .info { font-size: 14px; padding: 4px 10px; }
            .fullscreen-btn, .close-btn { width: 36px; height: 36px; font-size: 20px; top: 8px; }
        }
        @media (max-width: 380px) {
            .joystick { width: 80px; height: 80px; }
            .joystick-knob { width: 32px; height: 32px; }
            .fire-btn { width: 70px; height: 70px; font-size: 22px; }
            .info { font-size: 12px; padding: 2px 6px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper" id="gameWrapper">
    <div class="info">
        <div class="info-item">🏆 <span id="scoreDisplay">0</span></div>
        <div class="info-item">❤️ <span id="livesDisplay">3</span></div>
        <div class="info-item">👾 <span id="enemiesDisplay">0</span></div>
        <div class="info-item">🎯 <span id="roundDisplay" class="round">1</span></div>
        <div class="bonus-indicator" id="bonusIndicator"></div>
    </div>
    <div class="game-container">
        <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>
        <button class="close-btn" id="closeBtn">✕</button>
        <canvas id="gameCanvas" width="780" height="780"></canvas>
    </div>
    <div class="controls">
        <div class="joystick-area"><div class="joystick" id="joystick"><div class="joystick-knob" id="joystickKnob"></div></div></div>
        <div class="fire-area"><div class="fire-btn" id="fireBtn">🔥</div></div>
    </div>
</div>

<script>
    (function() {
        // ---------- Telegram Web App ----------
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                tg.requestOrientation('portrait');
            }
        } catch(e) { console.log("Not in Telegram"); }

        // ---------- Игровые константы ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const livesSpan = document.getElementById('livesDisplay');
        const enemiesSpan = document.getElementById('enemiesDisplay');
        const roundSpan = document.getElementById('roundDisplay');
        const bonusIndicator = document.getElementById('bonusIndicator');

        const TILE = 60; const COLS = 13; const ROWS = 13;
        const PLAYER_SPEED = 3.5;
        const ENEMY_BASE_SPEED = 1.5;
        const BULLET_SPEED = 7.0;
        const MAX_ENEMIES_ON_SCREEN = 4;
        const SPAWN_DELAY = 80;

        // ---------- Состояние игры ----------
        let gameOver = false, win = false, score = 0, lives = 3, frame = 0;
        let enemiesAlive = 0, currentRound = 1, enemiesPerRound = 8;
        let enemiesSpawnedInRound = 0, enemiesKilledInRound = 0, roundComplete = false;
        let playerBonuses = { speed: 0, shield: 0, power: 0 }; // таймеры бонусов

        // ---------- Игрок ----------
        const player = { x: 1*TILE, y: 12*TILE, w: TILE-2, h: TILE-2, dir:0, speed:PLAYER_SPEED, cooldown:0, alive:true, respawnTimer:0 };

        let bullets = [], enemies = [], walls = [], base = null, spawnTimer = 0;
        let particles = [];
        let bonuses = []; // бонусы на поле

        // ---------- Звук ----------
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
        }
        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                const s = {
                    fire: {type:'square', freq:[800,200], dur:0.1, vol:0.3},
                    explode: {type:'sawtooth', freq:[150,50], dur:0.3, vol:0.4},
                    damage: {type:'sine', freq:[300,100], dur:0.2, vol:0.5},
                    win: {type:'square', freq:[523,659,784], dur:0.5, vol:0.3},
                    gameover: {type:'sawtooth', freq:[200,80], dur:0.8, vol:0.4},
                    bonus: {type:'sine', freq:[880,660], dur:0.2, vol:0.2}
                }[type];
                if (!s) return;
                osc.type = s.type;
                osc.frequency.setValueAtTime(s.freq[0], now);
                if (s.freq.length > 1) osc.frequency.exponentialRampToValueAtTime(s.freq[1], now + s.dur);
                gain.gain.setValueAtTime(s.vol, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + s.dur);
                osc.start(now); osc.stop(now + s.dur);
            } catch(e) {}
        }
        function vibrate(d) {
            try { if (navigator.vibrate) navigator.vibrate(d); } catch(e) {}
            // fallback звук
            try {
                if (audioCtx) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    const now = audioCtx.currentTime;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now); osc.stop(now + 0.04);
                }
            } catch(e) {}
        }

        // ---------- Частицы ----------
        function spawnExplosion(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * 2 * Math.PI;
                const speed = 1 + Math.random() * 4;
                const colors = color ? [color] : ['#ff6600','#ffaa00','#ff4400','#ffcc44','#ff0000'];
                particles.push({
                    x: x + (Math.random() - 0.5) * 10,
                    y: y + (Math.random() - 0.5) * 10,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 0.8 + Math.random() * 0.6,
                    decay: 0.008 + Math.random() * 0.015,
                    size: 2 + Math.random() * 6,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.98; p.vy *= 0.98;
                p.life -= p.decay; p.size *= 0.99;
                if (p.life <= 0 || p.size < 0.5) particles.splice(i, 1);
            }
        }
        function drawParticles() {
            ctx.save();
            ctx.shadowBlur = 20; ctx.shadowColor = '#ff8800';
            ctx.globalCompositeOperation = 'lighter';
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }
            ctx.restore();
            ctx.globalAlpha = 1;
        }

        // ---------- Бонусы ----------
        const BONUS_TYPES = ['speed', 'shield', 'power', 'life'];
        function dropBonus(x, y) {
            if (Math.random() > 0.25) return;
            const type = BONUS_TYPES[Math.floor(Math.random() * BONUS_TYPES.length)];
            bonuses.push({ x, y, type, w: 20, h: 20, vy: -1, alive: true, bob: 0 });
            playSound('bonus');
        }
        function updateBonuses() {
            for (let i = bonuses.length - 1; i >= 0; i--) {
                const b = bonuses[i];
                b.y += b.vy;
                b.bob += 0.1;
                if (b.y > canvas.height) { bonuses.splice(i,1); continue; }
                // проверка подбора игроком
                if (player.alive) {
                    if (b.x + b.w > player.x && b.x < player.x + player.w &&
                        b.y + b.h > player.y && b.y < player.y + player.h) {
                        applyBonus(b.type);
                        spawnExplosion(b.x + b.w/2, b.y + b.h/2, 15, '#00ff88');
                        bonuses.splice(i,1);
                    }
                }
            }
        }
        function applyBonus(type) {
            switch(type) {
                case 'speed': playerBonuses.speed = 300; break;
                case 'shield': playerBonuses.shield = 1; break;
                case 'power': playerBonuses.power = 300; break;
                case 'life': lives++; updateInfo(); break;
            }
            vibrate(50);
            playSound('bonus');
            updateBonusIndicator();
        }
        function updateBonusIndicator() {
            let str = '';
            if (playerBonuses.speed > 0) str += '⚡';
            if (playerBonuses.shield > 0) str += '🛡️';
            if (playerBonuses.power > 0) str += '💥';
            bonusIndicator.textContent = str;
        }
        // ---------- Генерация карты ----------
        function generateRandomMap() {
            walls = [];
            base = { x: 6*TILE, y: 12*TILE, w: TILE, h: TILE, alive: true };
            const defense = [{x:5,y:11},{x:6,y:11},{x:7,y:11},{x:5,y:12},{x:7,y:12}];
            for (let d of defense) walls.push({ x: d.x*TILE, y: d.y*TILE, w: TILE, h: TILE, type:'brick', hp:2 });

            const density = 0.35 + (currentRound * 0.01);
            const steelChance = 0.15;
            for (let r=0; r<ROWS; r++) {
                for (let c=0; c<6; c++) {
                    if (defense.some(d=>d.x===c && d.y===r)) continue;
                    if (r===12 && c===6) continue;
                    if (r===12 && c===1) continue;
                    if (r<2 && c<3) continue;
                    if (Math.random() < density) {
                        const type = Math.random() < steelChance ? 'steel' : 'brick';
                        const hp = type==='brick' ? 2 : 999;
                        walls.push({ x: c*TILE, y: r*TILE, w: TILE, h: TILE, type, hp });
                        const mirrorC = COLS-1-c;
                        if (!defense.some(d=>d.x===mirrorC && d.y===r) && !(r===12 && mirrorC===6) && !(r===12 && mirrorC===1))
                            walls.push({ x: mirrorC*TILE, y: r*TILE, w: TILE, h: TILE, type, hp });
                    }
                }
            }
            for (let i=0; i<2; i++) {
                const r = 3 + Math.floor(Math.random()*5);
                const c = 6;
                if (r!==12 && r!==11 && !defense.some(d=>d.x===c && d.y===r))
                    walls.push({ x: c*TILE, y: r*TILE, w: TILE, h: TILE, type:'steel', hp:999 });
            }
            for (let i=walls.length-1; i>=0; i--) {
                const w = walls[i];
                if (Math.abs(w.x - player.x) < 1.5*TILE && Math.abs(w.y - player.y) < 1.5*TILE) walls.splice(i,1);
            }
        }

        function loadLevel() { generateRandomMap(); }

        function startNewRound() {
            loadLevel();
            player.alive = true; player.cooldown = 0; player.respawnTimer = 0;
            enemies = []; bullets = []; particles = []; bonuses = [];
            enemiesAlive = 0; enemiesSpawnedInRound = 0; enemiesKilledInRound = 0;
            roundComplete = false; spawnTimer = 0;
            enemiesPerRound = 6 + (currentRound-1)*2;
            if (enemiesPerRound > 20) enemiesPerRound = 20;
            if (currentRound > 1) { lives++; playSound('win'); vibrate(200); }
            updateInfo(); roundSpan.textContent = currentRound;
        }

        function initGame() {
            score = 0; lives = 3; currentRound = 1; enemiesPerRound = 8;
            gameOver = false; win = false; particles = []; bonuses = [];
            loadLevel(); player.alive = true; enemies = []; bullets = []; enemiesAlive = 0;
            playerBonuses = { speed:0, shield:0, power:0 };
            updateBonusIndicator();
            updateInfo(); roundSpan.textContent = currentRound;
        }

        // ---------- Коллизии ----------
        function collidesWithWalls(x,y,w,h) {
            for (let wl of walls) if (x < wl.x+wl.w && x+w > wl.x && y < wl.y+wl.h && y+h > wl.y) return true;
            return false;
        }
        function collidesWithBase(x,y,w,h) {
            if (!base || !base.alive) return false;
            return (x < base.x+base.w && x+w > base.x && y < base.y+base.h && y+h > base.y);
        }
        function collidesWithEnemies(x,y,w,h,exclude) {
            for (let e of enemies) if (e!==exclude && e.alive && x < e.x+e.w && x+w > e.x && y < e.y+e.h && y+h > e.y) return true;
            return false;
        }
        function collidesWithPlayer(x,y,w,h) {
            if (!player.alive) return false;
            return (x < player.x+player.w && x+w > player.x && y < player.y+player.h && y+h > player.y);
        }

        // ---------- Спавн врага с типом ----------
        function spawnEnemy() {
            if (enemiesAlive >= MAX_ENEMIES_ON_SCREEN || gameOver || win || enemiesSpawnedInRound >= enemiesPerRound) return false;
            const spawnPoints = [{x:1*TILE,y:1*TILE},{x:6*TILE,y:1*TILE},{x:11*TILE,y:1*TILE}];
            let attempts = 0, pos = null;
            while (attempts < 10) {
                const idx = Math.floor(Math.random() * spawnPoints.length);
                const sp = spawnPoints[idx];
                let blocked = false;
                for (let e of enemies) if (e.alive && Math.abs(e.x-sp.x)<1.5*TILE && Math.abs(e.y-sp.y)<1.5*TILE) { blocked=true; break; }
                if (player.alive && Math.abs(player.x-sp.x)<1.5*TILE && Math.abs(player.y-sp.y)<1.5*TILE) blocked=true;
                if (!blocked) { pos = sp; break; }
                attempts++;
            }
            if (!pos) return false;
            
            // Выбор типа врага
            const rnd = Math.random();
            let type = 'normal';
            let hp = 1, speedMult = 1, fireRate = 1;
            if (currentRound > 2 && rnd < 0.2) { type = 'fast'; speedMult = 1.6; }
            else if (currentRound > 3 && rnd < 0.35) { type = 'armored'; hp = 2; }
            else if (currentRound > 4 && rnd < 0.45) { type = 'shooter'; fireRate = 0.5; }

            const speed = (ENEMY_BASE_SPEED + Math.random()*0.6 + currentRound*0.05) * speedMult;
            const enemy = { x:pos.x, y:pos.y, w:TILE-2, h:TILE-2, dir:2, speed:Math.min(speed,4.0), alive:true, cooldown:0, moveDir:2, changeDirTimer:0, hp, type, fireRate };
            enemies.push(enemy); enemiesAlive++; enemiesSpawnedInRound++;
            spawnExplosion(pos.x + TILE/2, pos.y + TILE/2, 20);
            return true;
        }

        // ---------- Стрельба ----------
        function fireBullet(x,y,dir,owner,power) {
            let bx = x + TILE/2 - 7, by = y + TILE/2 - 7;
            let dx = 0, dy = 0;
            const size = power ? 20 : 14;
            const speed = power ? BULLET_SPEED*1.5 : BULLET_SPEED;
            switch(dir) {
                case 0: dy = -speed; bx = x+10; by = y-10; break;
                case 1: dx = speed; bx = x+TILE+2; by = y+10; break;
                case 2: dy = speed; bx = x+10; by = y+TILE+2; break;
                case 3: dx = -speed; bx = x-10; by = y+10; break;
            }
            bullets.push({ x:bx, y:by, w:size, h:size, dx, dy, dir, owner, power: power || false });
            playSound('fire'); vibrate(30);
        }

        // ---------- Обновление ----------
        function update() {
            if (gameOver || win) return;
            frame++;

            // Обновление таймеров бонусов
            if (playerBonuses.speed > 0) playerBonuses.speed--;
            if (playerBonuses.power > 0) playerBonuses.power--;
            updateBonusIndicator();

            // Игрок
            if (player.alive) {
                let moveX = 0, moveY = 0;
                if (joystickActive) {
                    const len = Math.hypot(joystickDir.x, joystickDir.y);
                    if (len > 0.2) {
                        const normX = joystickDir.x/len, normY = joystickDir.y/len;
                        const angle = Math.atan2(normY, normX);
                        const deg = angle * 180 / Math.PI;
                        if (deg > -45 && deg <= 45) { moveX = 1; player.dir = 1; }
                        else if (deg > 45 && deg <= 135) { moveY = 1; player.dir = 2; }
                        else if (deg > -135 && deg <= -45) { moveY = -1; player.dir = 0; }
                        else { moveX = -1; player.dir = 3; }
                    }
                }
                const currentSpeed = player.speed + (playerBonuses.speed > 0 ? 2 : 0);
                if (moveX || moveY) {
                    let newX = player.x + moveX * currentSpeed, newY = player.y + moveY * currentSpeed;
                    if (newX < 0) newX = 0; if (newX + player.w > canvas.width) newX = canvas.width - player.w;
                    if (newY < 0) newY = 0; if (newY + player.h > canvas.height) newY = canvas.height - player.h;
                    if (!collidesWithWalls(newX,newY,player.w,player.h) && !collidesWithBase(newX,newY,player.w,player.h) && !collidesWithEnemies(newX,newY,player.w,player.h,null)) {
                        player.x = newX; player.y = newY;
                    } else {
                        if (moveX) {
                            let tryX = player.x + moveX * currentSpeed;
                            if (tryX >= 0 && tryX+player.w <= canvas.width && !collidesWithWalls(tryX,player.y,player.w,player.h) && !collidesWithBase(tryX,player.y,player.w,player.h) && !collidesWithEnemies(tryX,player.y,player.w,player.h,null))
                                player.x = tryX;
                        }
                        if (moveY) {
                            let tryY = player.y + moveY * currentSpeed;
                            if (tryY >= 0 && tryY+player.h <= canvas.height && !collidesWithWalls(player.x,tryY,player.w,player.h) && !collidesWithBase(player.x,tryY,player.w,player.h) && !collidesWithEnemies(player.x,tryY,player.w,player.h,null))
                                player.y = tryY;
                        }
                    }
                }
                if (player.cooldown > 0) player.cooldown--;
                if (firePressed && player.cooldown === 0 && player.alive) {
                    fireBullet(player.x, player.y, player.dir, 'player', playerBonuses.power > 0);
                    player.cooldown = playerBonuses.power > 0 ? 6 : 12;
                }
            } else {
                player.respawnTimer--;
                if (player.respawnTimer <= 0 && lives > 0) {
                    player.alive = true;
                    player.x = 1*TILE; player.y = 12*TILE; player.dir = 0;
                    spawnExplosion(player.x + TILE/2, player.y + TILE/2, 30);
                    if (collidesWithWalls(player.x,player.y,player.w,player.h)) {
                        player.y -= TILE;
                        if (collidesWithWalls(player.x,player.y,player.w,player.h)) player.y += TILE*2;
                    }
                }
            }

            // Враги
            for (let e of enemies) {
                if (!e.alive) continue;
                e.changeDirTimer--;
                if (e.changeDirTimer <= 0) {
                    // Интеллект: иногда поворачиваем к игроку
                    if (player.alive && Math.random() < 0.3) {
                        const dx = player.x - e.x, dy = player.y - e.y;
                        if (Math.abs(dx) > Math.abs(dy)) e.moveDir = dx > 0 ? 1 : 3;
                        else e.moveDir = dy > 0 ? 2 : 0;
                    } else {
                        e.moveDir = Math.floor(Math.random()*4);
                    }
                    e.changeDirTimer = 40 + Math.floor(Math.random()*60);
                }
                let dx = 0, dy = 0;
                switch(e.moveDir) {
                    case 0: dy = -e.speed; break;
                    case 1: dx = e.speed; break;
                    case 2: dy = e.speed; break;
                    case 3: dx = -e.speed; break;
                }
                let newX = e.x + dx, newY = e.y + dy;
                if (newX < 0) newX = 0; if (newX + e.w > canvas.width) newX = canvas.width - e.w;
                if (newY < 0) newY = 0; if (newY + e.h > canvas.height) newY = canvas.height - e.h;
                if (!collidesWithWalls(newX,newY,e.w,e.h) && !collidesWithBase(newX,newY,e.w,e.h) && !collidesWithEnemies(newX,newY,e.w,e.h,e) && !collidesWithPlayer(newX,newY,e.w,e.h)) {
                    e.x = newX; e.y = newY; e.dir = e.moveDir;
                } else {
                    e.changeDirTimer = 0;
                }
                if (e.cooldown > 0) e.cooldown--;
                if (e.cooldown === 0 && e.alive && Math.random() < (0.025 + currentRound*0.003) * (e.type === 'shooter' ? 2 : 1)) {
                    fireBullet(e.x, e.y, e.dir, 'enemy');
                    e.cooldown = (45 + Math.floor(Math.random()*30)) * (e.type === 'shooter' ? 0.6 : 1);
                }
            }

            // Спавн врагов
            if (!roundComplete && !gameOver) {
                spawnTimer--;
                if (spawnTimer <= 0 && enemiesAlive < MAX_ENEMIES_ON_SCREEN && enemiesSpawnedInRound < enemiesPerRound) {
                    if (spawnEnemy()) {
                        spawnTimer = SPAWN_DELAY - Math.min(currentRound*2, 40);
                        if (spawnTimer < 30) spawnTimer = 30;
                    } else spawnTimer = 15;
                }
            }

            // Пули
            for (let i=bullets.length-1; i>=0; i--) {
                const b = bullets[i];
                b.x += b.dx; b.y += b.dy;
                let remove = false;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) remove = true;

                if (!remove) {
                    for (let j=walls.length-1; j>=0; j--) {
                        const w = walls[j];
                        if (b.x < w.x+w.w && b.x+b.w > w.x && b.y < w.y+w.h && b.y+b.h > w.y) {
                            if (w.type === 'brick') {
                                if (b.power) {
                                    walls.splice(j,1);
                                } else {
                                    w.hp--;
                                    if (w.hp <= 0) walls.splice(j,1);
                                }
                                playSound('explode'); vibrate(50); spawnExplosion(w.x + TILE/2, w.y + TILE/2, 20);
                            }
                            remove = true; break;
                        }
                    }
                }
                if (!remove && base && base.alive) {
                    if (b.x < base.x+base.w && b.x+b.w > base.x && b.y < base.y+base.h && b.y+b.h > base.y) {
                        base.alive = false; remove = true; gameOver = true; playSound('gameover'); vibrate(300); spawnExplosion(base.x + TILE/2, base.y + TILE/2, 50);
                    }
                }
                if (!remove && b.owner === 'enemy' && player.alive) {
                    if (b.x < player.x+player.w && b.x+b.w > player.x && b.y < player.y+player.h && b.y+b.h > player.y) {
                        if (playerBonuses.shield > 0) {
                            playerBonuses.shield = 0;
                            spawnExplosion(player.x + TILE/2, player.y + TILE/2, 20, '#00aaff');
                            remove = true;
                            updateBonusIndicator();
                        } else {
                            player.alive = false; lives--; player.respawnTimer = 90; remove = true;
                            playSound('damage'); vibrate(150); updateInfo(); spawnExplosion(player.x + TILE/2, player.y + TILE/2, 40);
                            if (lives <= 0) { gameOver = true; playSound('gameover'); vibrate(400); }
                        }
                    }
                }
                if (!remove && b.owner === 'player') {
                    for (let e of enemies) {
                        if (!e.alive) continue;
                        if (b.x < e.x+e.w && b.x+b.w > e.x && b.y < e.y+e.h && b.y+b.h > e.y) {
                            e.hp--;
                            if (e.hp <= 0) {
                                e.alive = false; enemiesAlive--; enemiesKilledInRound++;
                                score += 10 + currentRound*2;
                                playSound('explode'); vibrate(80); spawnExplosion(e.x + TILE/2, e.y + TILE/2, 35);
                                dropBonus(e.x + TILE/2, e.y + TILE/2); // бонус при убийстве
                                if (enemiesKilledInRound >= enemiesPerRound) {
                                    roundComplete = true;
                                    playSound('win'); vibrate(200);
                                    setTimeout(() => {
                                        if (!gameOver && !win) { currentRound++; startNewRound(); }
                                    }, 1500);
                                }
                            }
                            remove = true; updateInfo(); break;
                        }
                    }
                }
                if (remove) bullets.splice(i,1);
            }

            // Проверка завершения раунда (если все враги убиты, но спавн закончился)
            if (!roundComplete && !gameOver && enemiesAlive === 0 && enemiesSpawnedInRound >= enemiesPerRound) {
                roundComplete = true;
                playSound('win'); vibrate(200);
                setTimeout(() => {
                    if (!gameOver && !win) { currentRound++; startNewRound(); }
                }, 1500);
            }

            updateParticles();
            updateBonuses();
            updateInfo();
        }

        function updateInfo() {
            scoreSpan.textContent = score;
            livesSpan.textContent = lives;
            enemiesSpan.textContent = enemiesAlive;
            roundSpan.textContent = currentRound;
        }

        // ---------- Рисование ----------
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#08081a'; ctx.fillRect(0,0,canvas.width,canvas.height);
            // Виньетка
            const grd = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, canvas.width/1.5);
            grd.addColorStop(0, 'rgba(20, 30, 80, 0)');
            grd.addColorStop(1, 'rgba(0, 0, 0, 0.8)');
            ctx.fillStyle = grd; ctx.fillRect(0,0,canvas.width,canvas.height);

            // Тени стен
            for (let w of walls) { ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(w.x+8, w.y+8, w.w, w.h); }
            
            // Стены
            for (let w of walls) {
                if (w.type === 'brick') {
                    ctx.fillStyle = '#8a4a2a'; ctx.fillRect(w.x, w.y, w.w, w.h);
                    const bw = w.w/4, bh = w.h/4;
                    for (let r=0; r<4; r++) for (let c=0; c<4; c++) {
                        const bx = w.x + c*bw, by = w.y + r*bh;
                        ctx.fillStyle = ((r+c)%2===0) ? '#cc6633' : '#b85522';
                        ctx.fillRect(bx+1, by+1, bw-2, bh-2);
                        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(bx+1, by+1, bw-2, 2); ctx.fillRect(bx+1, by+1, 2, bh-2);
                        ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(bx+1, by+bh-3, bw-2, 2); ctx.fillRect(bx+bw-3, by+1, 2, bh-2);
                    }
                } else if (w.type === 'steel') {
                    const grad = ctx.createLinearGradient(w.x, w.y, w.x+w.w, w.y+w.h);
                    grad.addColorStop(0, '#eee'); grad.addColorStop(0.3, '#aaa'); grad.addColorStop(0.7, '#888'); grad.addColorStop(1, '#444');
                    ctx.fillStyle = grad; ctx.fillRect(w.x, w.y, w.w, w.h);
                    ctx.strokeStyle = '#666'; ctx.lineWidth = 1.5; ctx.strokeRect(w.x, w.y, w.w, w.h);
                    ctx.beginPath(); ctx.moveTo(w.x+w.w/2, w.y); ctx.lineTo(w.x+w.w/2, w.y+w.h); ctx.moveTo(w.x, w.y+w.h/2); ctx.lineTo(w.x+w.w, w.y+w.h/2); ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(w.x+4, w.y+4, w.w-8, 2); ctx.fillRect(w.x+4, w.y+4, 2, w.h-8);
                }
            }

            // База
            if (base && base.alive) {
                ctx.shadowColor = '#f0d060'; ctx.shadowBlur = 40;
                ctx.fillStyle = '#f0d060'; ctx.fillRect(base.x, base.y, base.w, base.h);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#d4a020'; ctx.lineWidth = 4; ctx.strokeRect(base.x, base.y, base.w, base.h);
                ctx.fillStyle = '#d4a020'; ctx.font = 'bold 46px "Courier New"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('★', base.x+base.w/2, base.y+base.h/2);
                ctx.shadowColor = '#f0d060'; ctx.shadowBlur = 60;
                ctx.fillStyle = 'rgba(255, 220, 0, 0.1)'; ctx.fillRect(base.x-10, base.y-10, base.w+20, base.h+20);
                ctx.shadowBlur = 0;
            } else if (base && !base.alive) {
                ctx.fillStyle = '#4a3a2a'; ctx.fillRect(base.x, base.y, base.w, base.h);
                ctx.fillStyle = '#2a1a0a'; ctx.font = 'bold 46px "Courier New"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('✕', base.x+base.w/2, base.y+base.h/2);
            }

            // Враги
            for (let e of enemies) {
                if (!e.alive) continue;
                let color = '#ff4422';
                if (e.type === 'fast') color = '#44aaff';
                else if (e.type === 'armored') color = '#ffaa00';
                else if (e.type === 'shooter') color = '#cc44ff';
                ctx.shadowColor = color; ctx.shadowBlur = 25;
                ctx.fillStyle = color; ctx.fillRect(e.x, e.y, e.w, e.h); ctx.shadowBlur = 0;
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(e.x+2, e.y+2, e.w-4, e.h-4);
                ctx.fillStyle = '#000'; ctx.fillRect(e.x+4, e.y+4, e.w-8, e.h-8);
                ctx.fillStyle = '#222'; let cx = e.x+e.w/2, cy = e.y+e.h/2;
                switch(e.dir) {
                    case 0: ctx.fillRect(cx-5, e.y-10, 10, 14); break;
                    case 1: ctx.fillRect(e.x+e.w-10, cy-5, 14, 10); break;
                    case 2: ctx.fillRect(cx-5, e.y+e.h-4, 10, 14); break;
                    case 3: ctx.fillRect(e.x-4, cy-5, 14, 10); break;
                }
                ctx.fillStyle = '#111';
                for (let i=0; i<4; i++) {
                    ctx.fillRect(e.x+2+i*6, e.y+2, 4, 6); ctx.fillRect(e.x+2+i*6, e.y+e.h-8, 4, 6);
                    ctx.fillRect(e.x+e.w-2-i*6, e.y+2, 4, 6); ctx.fillRect(e.x+e.w-2-i*6, e.y+e.h-8, 4, 6);
                }
                if (e.hp > 1) { ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 2; ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 15; ctx.strokeRect(e.x-2, e.y-2, e.w+4, e.h+4); ctx.shadowBlur = 0; }
            }

            // Игрок
            if (player.alive) {
                ctx.shadowColor = playerBonuses.shield > 0 ? '#00aaff' : '#00ff88';
                ctx.shadowBlur = 35;
                ctx.fillStyle = '#22dd88'; ctx.fillRect(player.x, player.y, player.w, player.h); ctx.shadowBlur = 0;
                ctx.strokeStyle = '#00aa55'; ctx.lineWidth = 2; ctx.strokeRect(player.x+2, player.y+2, player.w-4, player.h-4);
                ctx.fillStyle = '#00aa55'; ctx.fillRect(player.x+4, player.y+4, player.w-8, player.h-8);
                ctx.fillStyle = '#006633'; let cx = player.x+player.w/2, cy = player.y+player.h/2;
                switch(player.dir) {
                    case 0: ctx.fillRect(cx-5, player.y-10, 10, 14); break;
                    case 1: ctx.fillRect(player.x+player.w-10, cy-5, 14, 10); break;
                    case 2: ctx.fillRect(cx-5, player.y+player.h-4, 10, 14); break;
                    case 3: ctx.fillRect(player.x-4, cy-5, 14, 10); break;
                }
                ctx.fillStyle = '#004422';
                for (let i=0; i<4; i++) {
                    ctx.fillRect(player.x+2+i*6, player.y+2, 4, 8); ctx.fillRect(player.x+2+i*6, player.y+player.h-10, 4, 8);
                    ctx.fillRect(player.x+player.w-2-i*6, player.y+2, 4, 8); ctx.fillRect(player.x+player.w-2-i*6, player.y+player.h-10, 4, 8);
                }
                ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 2*Math.PI); ctx.fillStyle = '#00aa55'; ctx.fill(); ctx.strokeStyle = '#006633'; ctx.lineWidth = 2; ctx.stroke();
                // щит (эффект)
                if (playerBonuses.shield > 0) {
                    ctx.strokeStyle = 'rgba(0, 170, 255, 0.6)';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#00aaff'; ctx.shadowBlur = 20;
                    ctx.strokeRect(player.x-4, player.y-4, player.w+8, player.h+8);
                    ctx.shadowBlur = 0;
                }
            }

            // Пули
            for (let b of bullets) {
                ctx.shadowColor = b.power ? '#ff00ff' : '#ffaa00';
                ctx.shadowBlur = 40;
                ctx.fillStyle = b.power ? '#ff00ff' : '#ffcc00';
                ctx.fillRect(b.x, b.y, b.w, b.h); ctx.shadowBlur = 0;
                ctx.strokeStyle = '#880088'; ctx.lineWidth = 2; ctx.strokeRect(b.x+1, b.y+1, b.w-2, b.h-2);
                ctx.fillStyle = b.power ? '#ff66ff' : '#ff8800';
                ctx.fillRect(b.x - b.dx/2, b.y - b.dy/2, 8, 8);
            }

            // Бонусы
            for (let b of bonuses) {
                const bob = Math.sin(b.bob) * 3;
                ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 20;
                ctx.font = '24px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                let icon = '?';
                if (b.type === 'speed') icon = '⚡';
                else if (b.type === 'shield') icon = '🛡️';
                else if (b.type === 'power') icon = '💥';
                else if (b.type === 'life') icon = '❤️';
                ctx.fillText(icon, b.x + b.w/2, b.y + b.h/2 + bob);
                ctx.shadowBlur = 0;
            }

            // Частицы
            drawParticles();

            // Экранные сообщения
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 40;
                ctx.fillStyle = '#ff3333'; ctx.font = 'bold 60px "Courier New"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 40);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#aaa'; ctx.font = '28px "Courier New"'; ctx.fillText('tap to restart', canvas.width/2, canvas.height/2 + 50);
            } else if (roundComplete && !gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 50;
                ctx.fillStyle = '#00ff88'; ctx.font = 'bold 56px "Courier New"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('ROUND COMPLETE!', canvas.width/2, canvas.height/2 - 20);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#aaa'; ctx.font = '28px "Courier New"'; ctx.fillText('Next round starting...', canvas.width/2, canvas.height/2 + 50);
            }
        }

        function gameLoop() {
            if (!gameOver && !win) update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            if (!gameOver && !win) return;
            initGame(); updateInfo();
        }

        // ---------- Управление ----------
        let joystickActive = false, joystickDir = {x:0,y:0}, firePressed = false;
        const joystickEl = document.getElementById('joystick');
        const knob = document.getElementById('joystickKnob');
        const fireBtn = document.getElementById('fireBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const closeBtn = document.getElementById('closeBtn');

        let jcx=0, jcy=0, jr=0;
        function updateJoystickPos() {
            const rect = joystickEl.getBoundingClientRect();
            jcx = rect.left + rect.width/2; jcy = rect.top + rect.height/2; jr = rect.width/2 - 12;
        }
        function handleJoystick(clientX, clientY) {
            updateJoystickPos();
            let dx = clientX - jcx, dy = clientY - jcy;
            const dist = Math.hypot(dx, dy);
            if (dist < 10) { joystickActive = false; joystickDir = {x:0,y:0}; knob.style.transform = 'translate(-50%, -50%)'; return; }
            joystickActive = true;
            let clampedDist = Math.min(dist, jr);
            let angle = Math.atan2(dy, dx);
            let kx = Math.cos(angle) * clampedDist, ky = Math.sin(angle) * clampedDist;
            knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
            const norm = Math.max(Math.abs(kx), Math.abs(ky), 1);
            joystickDir = { x: kx / norm, y: ky / norm };
        }
        function resetJoystick() { joystickActive = false; joystickDir = {x:0,y:0}; knob.style.transform = 'translate(-50%, -50%)'; }

        joystickEl.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; handleJoystick(t.clientX, t.clientY); });
        joystickEl.addEventListener('touchmove', e => { e.preventDefault(); const t = e.changedTouches[0]; handleJoystick(t.clientX, t.clientY); });
        joystickEl.addEventListener('touchend', e => { e.preventDefault(); resetJoystick(); });
        joystickEl.addEventListener('touchcancel', e => { e.preventDefault(); resetJoystick(); });

        fireBtn.addEventListener('touchstart', e => { e.preventDefault(); firePressed = true; initAudio(); });
        fireBtn.addEventListener('touchend', e => { e.preventDefault(); firePressed = false; });
        fireBtn.addEventListener('touchcancel', e => { e.preventDefault(); firePressed = false; });

        joystickEl.addEventListener('mousedown', e => { handleJoystick(e.clientX, e.clientY); });
        window.addEventListener('mousemove', e => { if (e.buttons & 1) handleJoystick(e.clientX, e.clientY); });
        window.addEventListener('mouseup', resetJoystick);
        fireBtn.addEventListener('mousedown', () => { firePressed = true; initAudio(); });
        fireBtn.addEventListener('mouseup', () => { firePressed = false; });

        canvas.addEventListener('click', () => { if (gameOver) restartGame(); });
        canvas.addEventListener('touchend', e => { if (gameOver) { e.preventDefault(); restartGame(); } });

        fullscreenBtn.addEventListener('click', () => {
            initAudio();
            if (tg) {
                if (!tg.isFullscreen) tg.requestFullscreen();
                else tg.exitFullscreen();
            } else {
                if (!document.fullscreenElement) {
                    const el = document.documentElement;
                    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
                    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            }
        });

        closeBtn.addEventListener('click', () => {
            initAudio();
            if (tg) tg.close();
        });

        document.addEventListener('touchmove', e => { if (e.target.closest('.game-wrapper')) e.preventDefault(); }, { passive: false });

        // ---------- Запуск ----------
        initGame();
        gameLoop();
    })();
</script>
</body>
</html>
